# Версия тулчейна зафиксирована намеренно.
# Причина: reproducible builds (ADR-020) требуют детерминированного компилятора.
# Обновление версии — отдельный PR с прогоном полного набора тестов и фаззинга.

[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
profile = "minimal"

# ПОЛИТИКА ОБНОВЛЕНИЯ ВЕРСИИ
#
# Версия зафиксирована ради воспроизводимых сборок (ADR-020), но
# «зафиксирована» не значит «заморожена навсегда». Устаревший компилятор —
# это отсутствие исправлений в самом rustc и в стандартной библиотеке,
# то есть уязвимость, а не стабильность.
#
# Правило: обновляться до актуального stable не реже раза в квартал,
# отдельным PR, с полным прогоном тестов, clippy и фаззинга.
# Проверять, что cargo-deny и cargo-audit поддерживают выбранную версию:
# они регулярно поднимают минимальную требуемую версию rustc.

# Целевые платформы намеренно НЕ перечислены здесь.
#
# Причина: rustup ставит targets из этого файла всем и всегда. Разработчику
# на Windows не нужен std для aarch64-apple-ios (собрать его всё равно нельзя
# без macOS SDK), а лишние 7 таргетов — это заметная загрузка при первом
# запуске cargo.
#
# Targets задаются там, где реально используются:
#   * CI               — .github/workflows/rust.yml, матрица сборки
#   * сборка для iOS   — tools/build-rust-ios.sh
#   * сборка Android   — tools/build-rust-android.sh
#
# Воспроизводимость сборки (ADR-020) обеспечивается версией компилятора,
# а не набором предустановленных таргетов.
#
# Полный список целевых платформ:
#   aarch64-apple-ios · aarch64-apple-ios-sim · x86_64-apple-ios
#   aarch64-linux-android · armv7-linux-androideabi
#   x86_64-linux-android · i686-linux-android
