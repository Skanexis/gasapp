# ============================================================================
#  cargo-deny — КЛИЕНТСКИЙ workspace (crates/)
#
#  🔴 Этот файл — юридическая защита проекта.
#     Попадание copyleft-лицензии в клиентскую сборку делает публикацию
#     в Apple App Store невозможной (ADR-005, ADR-006).
#     Ослаблять правила ниже нельзя без правки ADR-006.
#
#  Запуск:  cargo deny --manifest-path crates/Cargo.toml check
# ============================================================================

[graph]
targets = [
    { triple = "aarch64-apple-ios" },
    { triple = "aarch64-apple-ios-sim" },
    { triple = "x86_64-apple-ios" },
    { triple = "aarch64-linux-android" },
    { triple = "armv7-linux-androideabi" },
    { triple = "x86_64-linux-android" },
    { triple = "i686-linux-android" },
]
all-features = true
# Dev-зависимости не попадают в поставляемый артефакт, поэтому их лицензии
# и баны не проверяются. Иначе proptest (тянет `rand`) ломал бы сборку.
exclude-dev = true

# ----------------------------------------------------------------------------
#  ЛИЦЕНЗИИ
# ----------------------------------------------------------------------------
[licenses]
# Permissive плюс MPL-2.0. Copyleft уровня GPL в клиенте запрещён.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",

    # MPL-2.0 — это UniFFI (ADR-003).
    #
    # Почему MPL разрешена, а GPL нет, хотя обе называются copyleft:
    #
    #   GPL/AGPL — copyleft уровня ПРОИЗВЕДЕНИЯ. Заражает всё приложение
    #   и содержит запрет на «дополнительные ограничения», который
    #   конфликтует с условиями App Store. Именно из-за этого пришлось
    #   отказаться от libsignal (ADR-005).
    #
    #   MPL-2.0 — copyleft уровня ФАЙЛА. Требует публиковать изменения
    #   только в самих MPL-файлах и явно разрешает линковку с кодом
    #   под любой другой лицензией (§3.3). Приложения под MPL-2.0
    #   присутствуют в App Store без юридических проблем.
    #
    # 🔴 ОГРАНИЧЕНИЕ, О КОТОРОМ НЕЛЬЗЯ ЗАБЫВАТЬ:
    #   если мы форкнем или изменим исходники MPL-зависимости, изменённые
    #   файлы обязаны остаться под MPL-2.0 и быть опубликованы. Использование
    #   без изменений — обязательств не создаёт. Поэтому патчить UniFFI
    #   локально нельзя: только апстрим-вклад или обёртка своим кодом.
    "MPL-2.0",
]
# Не принимаем «похоже на MIT» — только точное совпадение текста лицензии.
confidence-threshold = 1.0
unused-allowed-license = "warn"

# Исключений нет и быть не должно. Если крейт требует исключения —
# он не подходит проекту, ищем замену.
exceptions = []

# ----------------------------------------------------------------------------
#  ЗАПРЕЩЁННЫЕ КРЕЙТЫ
# ----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"              # 🔐 никаких version = "*"
allow-wildcard-paths = true     # path-зависимости внутри workspace — можно

deny = [
    # --- Copyleft: юридический блокер для App Store ---
    { crate = "libsignal-protocol", reason = "AGPL-3.0. Только как генератор тестовых векторов в изолированном контейнере, никогда как зависимость (ADR-005)" },

    # --- Аналитика и телеметрия: запрещены Правилом 7 ---
    { crate = "sentry", reason = "телеметрия запрещена (раздел 4.2)" },
    { crate = "sentry-core", reason = "телеметрия запрещена" },
    { crate = "opentelemetry", reason = "телеметрия в клиенте запрещена" },

    # --- Криптография: только одна реализация каждого примитива ---
    { crate = "openssl", reason = "используем RustCrypto/dalek; C-код увеличивает поверхность атаки" },
    { crate = "openssl-sys", reason = "см. openssl" },
    { crate = "native-tls", reason = "используем rustls" },
    { crate = "ring", reason = "конфликтует с выбором RustCrypto; двойная реализация примитивов недопустима" },
    { crate = "md-5", reason = "MD5 запрещён (раздел 6.1)" },
    { crate = "sha1", reason = "SHA-1 запрещён (раздел 6.1)" },

    # --- Слабые/устаревшие источники случайности ---
    { crate = "rand", reason = "в крипто-коде используем rand_core + OsRng напрямую" },
]

skip = []
skip-tree = []

# ----------------------------------------------------------------------------
#  УЯЗВИМОСТИ
# ----------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Любая известная уязвимость останавливает сборку. Без исключений.
yanked = "deny"
ignore = []

# ----------------------------------------------------------------------------
#  ИСТОЧНИКИ
# ----------------------------------------------------------------------------
[sources]
# 🔐 Только crates.io. Никаких git-зависимостей в клиентском коде:
#    git-зависимость может быть изменена задним числом (force-push),
#    что ломает reproducible builds и открывает вектор supply-chain.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
