#
# Настройки выпуска GasApp — ОДНО место для Android и iOS.
#
# Здесь нет секретов: адрес сервера, onion-адрес и пины всё равно
# зашиты в каждую копию приложения и видны любому, кто её разберёт.
# Секреты (ключ подписи, пароли, ключ App Store Connect) — только на
# флешке V: и в Bitwarden.
#
# Поменяли что-то здесь — запустите:
#     python3 tools/apply-release-config.py
# Он перепишет пины и адреса в android/.../network_security_config.xml
# и ios/Config/Base.xcconfig. tools/release-android.sh и сборка
# TestFlight в Codemagic проверяют, что это сделано.

# Версия, которую видит человек, и номер сборки Android. Номер — целое
# и обязан расти с каждой выгрузкой в Google Play. Номер сборки iOS
# ставится сам (дата и время сборки).
VERSION_NAME=1.0
VERSION_CODE=1

# Сервер сообщений и сайт с документами.
SERVER_URL=https://api.gasapp.eu
DOCS_URL=https://gasapp.eu

# Onion-адрес сервера (шаг 19), «адрес.onion:443»; пусто — без onion.
SERVER_ONION=kxgqz3c4roa3ib7yoidz4cioap5ti4fz63xe5a7e2iwu6ncfyqsxbhqd.onion:443

# 🔴 Пины ключа TLS сервера (SPKI SHA-256, base64) — V:\gasapp\pins.txt.
# Основной стоит на балансировщике, запасной лежит только на флешке.
# tools/release-android.sh сверяет основной с тем, что сервер отдаёт
# прямо сейчас: ошибка в пине = ни у кого нет связи до новой версии.
PIN_PRIMARY=MBTjAAasPRzKnp6gIy6c03Yf0VKluvRmF2pfpjwKHpo=
PIN_BACKUP=bcrsaCySvCUxMTpgkeRXlcT0X0pXzmyTluBWMja6bEA=

# После этой даты пины не проверяются (PIN_EXPIRATION из bundle.conf).
# Релиз, которому до неё меньше полугода, не соберётся.
PIN_EXPIRATION=2027-12-01
