# Pre-commit configuration for GasApp
# See https://pre-commit.com/ for more information
# See https://pre-commit.com/hooks.html for available hooks

# Сгенерированное и чужое не правим: биндинги UniFFI пересоздаются при
# каждой сборке ядра (правка исчезла бы), текст лицензии шрифта — как
# у автора.
exclude: ^(android/app/src/main/kotlin/uniffi/|ios/GasApp/Generated/|design/fonts/.*\.txt$)

repos:
  # Gitleaks for secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.16.2  # Use latest stable version
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]

  # Cargo formatting check
  #
  # В корне репозитория нет Cargo.toml — workspace два (crates/ и
  # server/), и голый `cargo fmt --check` падал на любом .rs. В CI
  # форматирование проверяет rust.yml, здесь хук пропускается
  # (SKIP=cargo-fmt-check в security.yml).
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: bash -c 'cargo fmt --check --manifest-path crates/Cargo.toml && cargo fmt --check --manifest-path server/Cargo.toml'
        language: system
        types: [rust]
        pass_filenames: false

  # Trailing whitespace fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace

  # End of file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer

  # Check for merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
