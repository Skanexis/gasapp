# SPDX-License-Identifier: Apache-2.0
[package]
name = "gasapp-types"
description = "Общие типы GasApp: Secret<T>, newtype-обёртки, идентификаторы, ошибки"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }
subtle = { version = "=2.6.1" }
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
hex = "0.4"
hex-literal = "0.4"