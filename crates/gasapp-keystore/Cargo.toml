# SPDX-License-Identifier: Apache-2.0
[package]
name = "gasapp-keystore"
description = "Иерархия ключей, KEK/DEK, аппаратное хранилище"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gasapp-types.workspace = true
zeroize.workspace = true
hkdf.workspace = true
sha2.workspace = true
argon2.workspace = true
rand_core.workspace = true
thiserror.workspace = true
async-trait = { workspace = true }
chacha20poly1305.workspace = true
# Хеширование в кривую P-256 (RFC 9380) — точка-проба для Secure Enclave
# на iOS (`pin::enclave_probe`). Крейт уже в дереве зависимостей ядра.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "hash2curve"] }

[dev-dependencies]
proptest = "1.0"
hex = "0.4"
# Трейт HardwareKeyProvider асинхронный (обращения к Secure Enclave/StrongBox
# блокирующие), поэтому тестам нужен исполнитель. Только для тестов:
# в сам крейт runtime не тянется.
tokio = { version = "1", features = ["macros", "rt"] }