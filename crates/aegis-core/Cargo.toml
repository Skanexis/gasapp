# SPDX-License-Identifier: Apache-2.0
[package]
name = "aegis-core"
description = "Фасад для UI: оркестрация, состояние, поток событий"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-types.workspace = true
aegis-media.workspace = true
aegis-protocol.workspace = true
aegis-storage.workspace = true
aegis-net.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand_core.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json = "1"
rand_core = { workspace = true, features = ["getrandom"] }
uuid = { workspace = true }
aegis-net = { workspace = true }
proptest.workspace = true
hex.workspace = true

[features]
# Проброс: сборка под Android требует вендоринга OpenSSL,
# а флаг задаётся на уровне собираемого крейта.
vendored-openssl = ["aegis-storage/vendored-openssl"]
