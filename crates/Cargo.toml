[workspace]
resolver = "2"
members = [
    "gasapp-types",
    "gasapp-proto",
    "gasapp-protocol",
    "gasapp-keystore",
    "gasapp-storage",
    "gasapp-net",
    "gasapp-media",
    "gasapp-backup",
    "gasapp-core",
    "gasapp-ffi",
    "gasapp-tor",
    "gasapp-bot",
]

[workspace.dependencies]
# External dependencies used with workspace = true in crates
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }
hkdf = { version = "=0.12.4" }
qrcode = { version = "0.14", default-features = false }
sha2 = { version = "=0.10.8" }
argon2 = { version = "=0.6.0-rc.8" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
thiserror = { version = "=2.0" }
async-trait = { version = "0.1" }
tracing = { version = "=0.1.44" }
aes-gcm = { version = "=0.10.3" }
chacha20poly1305 = { version = "=0.10.0" }
uuid = { version = "=1", features = ["v4", "serde"] }
hex = { version = "=0.4" }
proptest = { version = "=1.0" }
rusqlite = { version = "=0.37.0" }
# Local crates (workspace members)
gasapp-types = { path = "gasapp-types" }
gasapp-proto = { path = "gasapp-proto" }
gasapp-protocol = { path = "gasapp-protocol" }
gasapp-keystore = { path = "gasapp-keystore" }
gasapp-storage = { path = "gasapp-storage" }
gasapp-net = { path = "gasapp-net" }
gasapp-media = { path = "gasapp-media" }
gasapp-backup = { path = "gasapp-backup" }
gasapp-core = { path = "gasapp-core" }
gasapp-ffi = { path = "gasapp-ffi" }
gasapp-tor = { path = "gasapp-tor" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
# Крейты GasApp — части приложения, а не библиотеки для чужого использования.
# На crates.io они не публикуются никогда.
#
# Помимо защиты от случайной публикации это делает корректной проверку
# cargo-deny: её allow-wildcard-paths применяется только к непубликуемым
# крейтам, потому что crates.io запрещает path-зависимости.
publish = false
authors = ["The GasApp Authors"]
repository = "https://github.com/gasapp-messenger/gasapp"
homepage = "https://gasapp.eu"

[workspace.lints]
# Правила раздела 4.2 плана. Секция была пустой: `clippy.toml` ссылался
# на запрет unwrap/expect/panic, которого в сборке не существовало, — то есть
# код проверялся пустым набором правил и любой `unwrap` проходил молча.
#
# Послабления для тестов заданы в `clippy.toml` (`allow-*-in-tests`): паника
# в тесте означает провалившийся тест, а не отказ у пользователя.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Паника в криптографическом коде — отказ в обслуживании, а не «не должно
# случиться». Каждый из вариантов ниже обязан быть заменён на `Result`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Арифметика: переполнение счётчика сообщений или длины буфера меняет
# криптографическое поведение, поэтому явные проверки обязательны.
arithmetic_side_effects = "deny"
integer_division = "deny"

# Профиль релиза: раздел 19.2 плана, пункт «.so не содержит debug-символов
# в release».
#
# Секции не было вовсе, хотя `tools/build-rust-android.sh` на неё ссылается.
# То есть libgasapp.so уезжала в APK с полной отладочной информацией: имена
# функций, номера строк и пути к исходникам на машине сборщика. Для
# реверс-инженера это карта, а абсолютный путь вида `C:\Users\<имя>\...`
# ещё и выдаёт того, кто собирал.
[profile.release]
# 🔐 "debuginfo", а не "symbols".
#
# `strip = "symbols"` срезает таблицу динамических символов, а вместе с ней
# метаданные UNIFFI_META_*, по которым uniffi-bindgen строит биндинги.
# Библиотека собирается без единой ошибки, а bindgen молча выдаёт ноль
# файлов — ровно тот случай, на который в скрипте сборки стоит явная
# проверка. Отладочная информация уходит, экспорт остаётся.
strip = "debuginfo"

# lto и codegen-units — два рычага размера, которые здесь безопасны.
#
# ⚠️ `opt-level = "z"` намеренно НЕ выставлен, хотя даёт APK заметно меньше.
# Растягивание PIN — Argon2id m=64 МиБ, t=3, p=4 (раздел 23.4) — при сборке
# по размеру замедляется в разы. Это и секунды ожидания на каждой
# разблокировке, и расход батареи: два пункта того же M8, которые
# уменьшение APK оплатило бы из чужого кармана.
lto = true
codegen-units = 1

# ⚠️ `panic = "abort"` намеренно НЕ выставлен.
#
# Он выглядит уместным для библиотеки за FFI: разворачивание стека через
# границу языка — неопределённое поведение. Но `gasapp-ffi` до границы его
# и не допускает — каждый вызов обёрнут в `catch_unwind`
# (`gasapp-ffi/src/lib.rs:92`), и паника превращается в ошибку FFI.
# С `panic = "abort"` этот перехват перестаёт работать молча, и любая
# паника в ядре становится падением приложения вместо сообщения об ошибке.
