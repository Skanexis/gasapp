[workspace]
resolver = "2"
members = [
    "aegis-types",
    "aegis-proto",
    "aegis-protocol",
    "aegis-keystore",
    "aegis-storage",
    "aegis-net",
    "aegis-media",
    "aegis-backup",
    "aegis-core",
    "aegis-ffi",
]

[workspace.dependencies]
# External dependencies used with workspace = true in crates
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }
hkdf = { version = "=0.12.4" }
qrcode = { version = "0.14", default-features = false }
sha2 = { version = "=0.10.8" }
argon2 = { version = "=0.6.0-rc.8" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
thiserror = { version = "=2.0" }
async-trait = { version = "=0.1.0" }
tracing = { version = "=0.1.44" }
aes-gcm = { version = "=0.10.3" }
chacha20poly1305 = { version = "=0.10.0" }
uuid = { version = "=1", features = ["v4", "serde"] }
hex = { version = "=0.4" }
proptest = { version = "=1.0" }
rusqlite = { version = "=0.32.0" }
# Local crates (workspace members)
aegis-types = { path = "aegis-types" }
aegis-proto = { path = "aegis-proto" }
aegis-protocol = { path = "aegis-protocol" }
aegis-keystore = { path = "aegis-keystore" }
aegis-storage = { path = "aegis-storage" }
aegis-net = { path = "aegis-net" }
aegis-media = { path = "aegis-media" }
aegis-backup = { path = "aegis-backup" }
aegis-core = { path = "aegis-core" }
aegis-ffi = { path = "aegis-ffi" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
# Крейты AEGIS — части приложения, а не библиотеки для чужого использования.
# На crates.io они не публикуются никогда.
#
# Помимо защиты от случайной публикации это делает корректной проверку
# cargo-deny: её allow-wildcard-paths применяется только к непубликуемым
# крейтам, потому что crates.io запрещает path-зависимости.
publish = false
authors = ["The AEGIS Authors"]
repository = "https://github.com/aegis-messenger/aegis"
homepage = "https://aegis.chat"

[workspace.lints]
# Правила раздела 4.2 плана. Секция была пустой: `clippy.toml` ссылался
# на запрет unwrap/expect/panic, которого в сборке не существовало, — то есть
# код проверялся пустым набором правил и любой `unwrap` проходил молча.
#
# Послабления для тестов заданы в `clippy.toml` (`allow-*-in-tests`): паника
# в тесте означает провалившийся тест, а не отказ у пользователя.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Паника в криптографическом коде — отказ в обслуживании, а не «не должно
# случиться». Каждый из вариантов ниже обязан быть заменён на `Result`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Арифметика: переполнение счётчика сообщений или длины буфера меняет
# криптографическое поведение, поэтому явные проверки обязательны.
arithmetic_side_effects = "deny"
integer_division = "deny"