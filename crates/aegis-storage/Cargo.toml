# SPDX-License-Identifier: Apache-2.0
[package]
name = "aegis-storage"
description = "Зашифрованное локальное хранилище на SQLCipher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-types.workspace = true
# Хранилище сохраняет и загружает `SessionState` как непрозрачный блоб.
# Разбирать состояние ratchet оно не умеет и не должно (раздел 11 плана).
aegis-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true
# SQLCipher с вендорингом OpenSSL.
#
# `bundled-sqlcipher` (без вендоринга) ждёт системный OpenSSL. Его нет
# ни в NDK — сборка под Android падает на `openssl/crypto.h file not
# found`, — ни на Windows-хосте. Разделить фичу по целевым платформам
# нельзя: cargo объединяет фичи одной зависимости, и Android-вариант
# всё равно применился бы к хостовой сборке.
#
# Вендоринг требует Perl, выдающего Unix-пути. Windows-Perl их не даёт,
# поэтому кросс-сборка под Android идёт в Linux-контейнере
# (tools/Dockerfile.android).
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

hex.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
hex.workspace = true
uuid.workspace = true
tempfile = "3"