# SPDX-License-Identifier: Apache-2.0
[package]
name = "aegis-storage"
description = "Зашифрованное локальное хранилище на SQLCipher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-types.workspace = true
# Хранилище сохраняет и загружает `SessionState` как непрозрачный блоб.
# Разбирать состояние ratchet оно не умеет и не должно (раздел 11 плана).
aegis-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true
# SQLCipher: вендоринг OpenSSL включается флагом, а не всегда.
#
# `bundled-sqlcipher` берёт системный OpenSSL. На Linux — в том числе
# на сервере сборки и в CI — он есть, и это самый быстрый путь.
#
# Вендоринг (`vendored-openssl`) собирает OpenSSL из исходников. Он
# нужен там, где системного нет: под Android, потому что NDK его не
# поставляет, и на Windows. Ценой того, что для сборки требуется Perl,
# выдающий Unix-пути, — Windows-Perl их не даёт.
#
# Флагом, а не постоянной фичей: иначе каждая сборка на любой машине
# тянет за собой OpenSSL и требование Perl, включая те, где системный
# OpenSSL доступен.
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

hex.workspace = true
uuid.workspace = true

[features]

# Собирать OpenSSL из исходников вместо системного.
#
# Включается там, где системного OpenSSL нет: сборка под Android
# (`cargo ndk --features vendored-openssl`) и на Windows. Требует Perl.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
proptest.workspace = true
hex.workspace = true
uuid.workspace = true
tempfile = "3"