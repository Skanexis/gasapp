# SPDX-License-Identifier: Apache-2.0
[package]
name = "aegis-protocol"
description = "PQXDH, Double Ratchet, SPQR, Sender Keys, safety numbers"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-types = { path = "../aegis-types" }
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }
subtle = { version = "=2.6.1" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = { version = "=0.10.8" }
hmac = { version = "=0.12.1" }
hkdf = { version = "=0.12.4" }
aes-gcm = { version = "=0.10.3" }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
curve25519-dalek = { version = "=4.1.3", features = ["zeroize"] }
ed25519-dalek = { version = "=2.1.1", features = ["zeroize"] }
thiserror = "2.0"
ml-kem = { version = "=0.3.2", features = ["zeroize"] }

[dev-dependencies]
proptest = "1"
hex = "0.4"