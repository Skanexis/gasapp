# SPDX-License-Identifier: Apache-2.0
#
# ⚠️ ЕДИНСТВЕННЫЙ КРЕЙТ ПРОЕКТА, ГДЕ РАЗРЕШЁН unsafe.
#    Причина: граница FFI между Rust и Swift/Kotlin (раздел 10 плана).
#    Весь unsafe здесь генерируется UniFFI, ручного unsafe быть не должно.
#    Крейт держится максимально тонким: конвертация типов и ничего больше.

[package]
name = "aegis-ffi"
description = "Граница FFI между aegis-core и клиентами на Swift/Kotlin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# staticlib — для iOS (линкуется в XCFramework)
# cdylib    — для Android (libaegis.so)
crate-type = ["staticlib", "cdylib", "lib"]
name = "aegis"

[lints.rust]
# Переопределяем workspace-настройку unsafe_code = "forbid".
# Это единственное место в проекте, где так делается.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Паника не должна пересекать границу FFI — её ловит catch_unwind,
# но в самом коде FFI паник быть не должно.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
aegis-core.workspace = true
aegis-protocol.workspace = true
aegis-types.workspace = true
thiserror.workspace = true
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

# Генератор биндингов для Swift и Kotlin.
# Библиотечный режим: биндинги строятся по собранной .so/.a, а не по
# отдельному описанию интерфейса — так исключается расхождение между
# тем, что экспортирует Rust, и тем, что видит платформа.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
