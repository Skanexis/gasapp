# SPDX-License-Identifier: Apache-2.0
[package]
name = "gasapp-core"
description = "Фасад для UI: оркестрация, состояние, поток событий"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gasapp-types.workspace = true
gasapp-media.workspace = true
gasapp-protocol.workspace = true
gasapp-storage.workspace = true
gasapp-backup.workspace = true
gasapp-keystore.workspace = true
gasapp-net.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand_core.workspace = true
sha2.workspace = true
uuid.workspace = true
zeroize.workspace = true

# Выгрузка данных (MASVS PRIVACY-3.1) отдаётся JSON'ом: его читает
# и человек, и чужая программа. Собирать его конкатенацией строк
# нельзя — первое же имя контакта с кавычкой сломало бы файл,
# а заметил бы это тот, кто пытается свои данные прочитать.
#
# Новой зависимостью в графе не становится: serde_json уже приходит
# через gasapp-net, который разбирает ответы сервера.
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rand_core = { workspace = true, features = ["getrandom"] }
uuid = { workspace = true }
gasapp-net = { workspace = true }
proptest.workspace = true
hex.workspace = true

[features]
# Проброс: сборка под Android требует вендоринга OpenSSL,
# а флаг задаётся на уровне собираемого крейта.
vendored-openssl = ["gasapp-storage/vendored-openssl"]
