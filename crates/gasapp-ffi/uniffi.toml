#
# Настройки генератора биндингов UniFFI.

[bindings.kotlin]
# 🔐 Биндинги генерируются для Android, а не для настольной JVM.
#
# # Что это меняет
#
# Без флага генератор вставляет выбор уборщика ссылок во время
# выполнения: `Class.forName("java.lang.ref.Cleaner")`, и если класс
# нашёлся — `java.lang.ref.Cleaner`, иначе уборщик из JNA.
#
# На Android `java.lang.ref.Cleaner` существует с API 33, а minSdk
# у приложения 28. Проверка через `Class.forName` корректна и на
# старых версиях честно падает в запасной путь — но её не видит
# статический анализ: lint отмечает три обращения к `Cleaner` как
# «Call requires API level 33» и роняет проверку релиза.
#
# С `android = true` генератор выдаёт Android-вариант: выбор идёт
# по `Build.VERSION.SDK_INT`, а классы новее minSdk помечены
# `@RequiresApi`. И то, и другое статический анализ понимает, поэтому
# три ошибки `NewApi` исчезают, а поведение на API 28–32 не меняется —
# там по-прежнему работает уборщик JNA.
#
# ⚠️ Подавить предупреждение в lint.xml было бы проще и хуже: тогда
# `NewApi` оказался бы отключён для всего файла биндингов, и следующее
# обращение к API новее 28 — уже настоящее — прошло бы молча.
android = true

# Уборщик выбирается явно, а не выводится из `android`.
#
# Флаги независимы: `android` влияет и на другие части генерации,
# и полагаться на то, что он всегда подразумевает Android-уборщик,
# значит зависеть от детали реализации генератора.
android_cleaner = true
