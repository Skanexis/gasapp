#
# Публичный сайт документов GasApp: политика, условия, правила
# сообщества, безопасность детей, удаление аккаунта, поддержка.
#
# Эти адреса вписаны в анкеты Google Play и App Store и открываются из
# приложения. Они обязаны отвечать всегда — в том числе когда сервер
# сообщений на обслуживании: поэтому сайт статический и от узлов
# приложения не зависит.
#
# Выкладка:
#
#   python tools/build-site.py --out site --base-url https://gasapp.eu
#   rsync -a --delete site/ root@сервер:/var/www/gasapp-site/
#
# 🔐 Сайт — единственное место, где адрес человека видит веб-сервер без
# Tor: страницы открываются в его браузере. Журнал доступа выключен,
# сторонних скриптов, шрифтов и счётчиков на страницах нет.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Заменить на домен сайта. Сертификат — обычный certbot (webroot):
    # ключ сайта приложение не пинит, и менять его при продлении можно.
    # Пиннингу подлежит только адрес сервера сообщений (gasapp-cert.sh).
    server_name gasapp.eu www.gasapp.eu;

    ssl_certificate     /etc/letsencrypt/live/gasapp.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gasapp.eu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/gasapp-site;
    index index.html;

    # Кто читал политику — не наше дело. error_log — тоже: nginx пишет
    # адрес посетителя в каждую строку ошибки.
    access_log off;
    error_log /dev/null emerg;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Страницы — текст и встроенные стили: ничего внешнего не грузится.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /.well-known/security.txt {
        default_type text/plain;
    }

    # Universal Links: iPhone (через сеть доставки Apple) скачивает этот
    # файл и с ним открывает ссылки https://gasapp.eu/add/#… прямо в
    # GasApp. Отдаётся как JSON, без переадресаций.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # Страница ссылки на контакт — единственная со скриптом: свой файл
    # add.js читает ключ из части адреса после «#» (на сервер она не
    # приходит) и собирает кнопку «Открыть в GasApp». Чужих скриптов
    # нет и здесь. add_header внутри location отменяет заголовки
    # server{}, поэтому они повторены.
    location ^~ /add/ {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
    location = /add { return 301 /add/; }

    # Прежние адреса из анкет — на нынешние.
    location = /delete-account { return 301 /account-deletion/; }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name gasapp.eu www.gasapp.eu;
    access_log off;
    error_log /dev/null emerg;

    # Проверка Let's Encrypt при продлении: без этого места порт 80
    # отвечал бы на неё переадресацией, и продление сертификата сайта
    # не проходило бы.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://gasapp.eu$request_uri;
    }
}
