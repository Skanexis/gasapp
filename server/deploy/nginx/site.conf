#
# Публичный сайт документов GasApp: политика, условия, правила
# сообщества, безопасность детей, удаление аккаунта, поддержка.
#
# Эти адреса вписаны в анкеты Google Play и App Store и открываются из
# приложения. Они обязаны отвечать всегда — в том числе когда сервер
# сообщений на обслуживании: поэтому сайт статический и от узлов
# приложения не зависит.
#
# Выкладка:
#
#   python tools/build-site.py --out site --base-url https://gasapp.chat
#   rsync -a --delete site/ root@сервер:/var/www/gasapp-site/
#
# 🔐 Сайт — единственное место, где адрес человека видит веб-сервер без
# Tor: страницы открываются в его браузере. Журнал доступа выключен,
# сторонних скриптов, шрифтов и счётчиков на страницах нет.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Заменить на домен сайта; сертификат — тот же способ, что у сервера
    # сообщений (server/deploy/certbot).
    server_name gasapp.chat www.gasapp.chat;

    ssl_certificate     /etc/gasapp/tls/site/fullchain.pem;
    ssl_certificate_key /etc/gasapp/tls/site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/gasapp-site;
    index index.html;

    # Кто читал политику — не наше дело.
    access_log off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Страницы — текст и встроенные стили: ничего внешнего не грузится.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /.well-known/security.txt {
        default_type text/plain;
    }

    # Прежние адреса из анкет — на нынешние.
    location = /delete-account { return 301 /account-deletion/; }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name gasapp.chat www.gasapp.chat;

    return 301 https://gasapp.chat$request_uri;
}
