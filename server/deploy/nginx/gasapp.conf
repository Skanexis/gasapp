#
# Балансировщик GasApp: /etc/nginx/conf.d/gasapp.conf
#
# Рядом: /etc/nginx/gasapp-upstream.inc (связь с узлами).
# Сайт пакета по умолчанию убрать: rm /etc/nginx/sites-enabled/default
#
# Заменить gasapp.example.com на свой домен, 10.0.0.x — на свою сеть.
# Проверка: nginx -t && systemctl reload nginx

# 🔐 Версия nginx не сообщается: подсказка, какие уязвимости пробовать.
server_tokens off;

# --- Ограничения по клиенту -------------------------------------------------
#
# 🔐 Ограничение по клиенту живёт здесь, и только здесь.
#
# Приложение ограничивает запросы по ИСКОМОМУ имени, а не по тому, кто
# спрашивает: адреса оно не видит и видеть не должно. Перебор словаря
# остановит только тот, кто видит клиента, — балансировщик. Адрес при
# этом никуда не пишется: limit_req держит его в разделяемой памяти,
# журналы ниже выключены.
#
# 10 МБ — около 160 000 адресов.
limit_req_zone  $binary_remote_addr zone=gasapp_discovery:10m rate=20r/m;
limit_req_zone  $binary_remote_addr zone=gasapp_general:10m   rate=600r/m;
# 🔐 Регистрация: письмо с кодом и сама регистрация. Узел шлёт не больше
# шестидесяти писем в минуту на всех (`CODES_PER_MINUTE`), и без предела
# по адресу один клиент выбирал бы весь бюджет — регистрация вставала бы
# у остальных, а узел рассылал бы письма на чужие адреса. Человеку
# хватает нескольких запросов: письмо, повтор, пара попыток имени.
limit_req_zone  $binary_remote_addr zone=gasapp_signup:10m    rate=6r/m;
limit_conn_zone $binary_remote_addr zone=gasapp_conn:10m;

# Onion-вход: адреса клиента за onion нет (все приходят с адреса
# контейнера Tor), поэтому бюджет — общий на весь вход. Слабее, чем
# по адресу, но не «без предела».
limit_req_zone  $server_name zone=gasapp_onion_discovery:1m rate=300r/m;
limit_req_zone  $server_name zone=gasapp_onion_general:1m   rate=6000r/m;
# Весь onion-вход — половина бюджета писем узла: регистрация через
# прямой вход остаётся возможной, даже когда onion-вход заливают.
limit_req_zone  $server_name zone=gasapp_onion_signup:1m    rate=30r/m;
limit_conn_zone $server_name zone=gasapp_onion_conn:1m;

# WebSocket — апгрейд; остальное — постоянное соединение с узлом.
map $http_upgrade $gasapp_connection {
    default upgrade;
    ""      "";
}

upstream gasapp_nodes {
    # /health узла отдаёт 503, если тот не видит базу или потерял
    # слушатель уведомлений.
    server 10.0.0.1:8443 max_fails=2 fail_timeout=10s;
    server 10.0.0.2:8443 max_fails=2 fail_timeout=10s;
    server 10.0.0.3:8443 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# --- Порт 80: только выпуск сертификата ------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    error_log /dev/null emerg;

    # certbot certonly --webroot -w /var/www/acme
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # Приложение ходит только по HTTPS; перенаправлять некого.
    # 444 — закрыть соединение без ответа.
    location / {
        return 444;
    }
}

# --- Порт 443 по умолчанию: чужое имя — обрыв рукопожатия ------------------
#
# 🔐 Сканеры обходят адреса и сохраняют отданный им сертификат — так
# по IP находят домен, а по домену — все его машины. Без правильного
# имени (SNI) сервер не отдаёт ничего.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null emerg;
}

# --- Публичный вход ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gasapp.example.com;

    # 🔐 Не /etc/letsencrypt/live, а копия, которую кладёт
    # certbot/gasapp-pin-gate.sh — и только если ключ совпадает с пином
    # приложения. Сертификат с чужим ключом оборвал бы связь у всех
    # установок; проверить это нужно ДО того, как nginx его увидит.
    ssl_certificate     /etc/gasapp/tls/public/fullchain.pem;
    ssl_certificate_key /etc/gasapp/tls/public/privkey.pem;

    # TLS 1.2 нужен: minSdk приложения — 28 (Android 9), а TLS 1.3
    # в платформе — с Android 10. Шифры 1.2 — только ECDHE + AEAD:
    # прямая секретность и никаких CBC.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:gasapp_tls:10m;
    ssl_session_timeout 1h;
    # 🔐 Без билетов сессии: ключ билетов живёт, пока живёт процесс nginx,
    # и его утечка раскрывает все сессии за это время.
    ssl_session_tickets off;
    # OCSP stapling не включается: Let's Encrypt закрыл OCSP в 2025 году.

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 🔐 Журналы выключены полностью.
    #
    # access_log с адресами превращает сервер в инструмент слежки
    # за собственными пользователями. error_log — тоже: nginx пишет адрес
    # клиента в каждую строку, в том числе на КАЖДЫЙ отказ limit_req
    # («limiting requests, … client: 203.0.113.7») — перебор имён
    # превратился бы в журнал адресов. Нужен на время отладки — только
    # на время и с удалением после.
    access_log off;
    error_log /dev/null emerg;
    limit_req_log_level info;

    # С запасом: многие приходят с одного выходного узла Tor, у каждого —
    # долгоживущий сокет уведомлений.
    limit_conn gasapp_conn 200;
    limit_conn_status 429;

    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     60s;
    # Узлы держат свои пределы по маршрутам; здесь — чуть выше их.
    client_max_body_size  4m;

    include /etc/nginx/gasapp-upstream.inc;

    # 🔐 Состояние узлов — не для интернета: версия подсказывает,
    # какие уязвимости пробовать. Монитор спрашивает узлы напрямую.
    location = /health {
        return 404;
    }

    location = /v1/attachments/blob {
        limit_req zone=gasapp_general burst=100 nodelay;
        limit_req_status 429;
        # Узел принимает до 101 МБ шифроблоба.
        client_max_body_size 102m;
        client_body_timeout 120s;
        proxy_pass https://gasapp_nodes;
    }

    # Медиа канала: зашифрованное фото, файл, аватар — до 32 МБ.
    # Загружает только владелец канала за подписью устройства; узел
    # проверяет подпись до чтения тела и держит не больше восьми
    # загрузок сразу. Без этого места загрузку крупнее 4 МБ отверг бы
    # сам балансировщик.
    location ~ "^/v1/channels/own/[0-9a-f-]{36}/[0-9a-f-]{36}/media$" {
        limit_req zone=gasapp_general burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 34m;
        client_body_timeout 120s;
        proxy_pass https://gasapp_nodes;
    }

    # 🔐 Регистрация — отдельный, тесный предел (см. зону выше).
    # Регистрация бота по токену — тоже создание аккаунта без подписи:
    # тот же предел, иначе её перебирали бы в обход него.
    location ~ "^/v1/(accounts/(email/code|register)|bots/register)$" {
        limit_req zone=gasapp_signup burst=6 nodelay;
        limit_req_status 429;
        proxy_pass https://gasapp_nodes;
    }

    # 🔐 Поиск по имени — им перебирают, кто зарегистрирован.
    # burst без nodelay: короткая очередь вместо отказа тому, кто
    # добавляет несколько контактов подряд.
    location ^~ /v1/discovery/ {
        limit_req zone=gasapp_discovery burst=5;
        limit_req_status 429;
        proxy_pass https://gasapp_nodes;
    }

    location / {
        limit_req zone=gasapp_general burst=100 nodelay;
        limit_req_status 429;
        # Сокет уведомлений живёт долго и молчит между уведомлениями.
        proxy_read_timeout 3600s;
        proxy_pass https://gasapp_nodes;
    }
}

# --- Onion-вход -------------------------------------------------------------
#
# 🔴 Onion — через балансировщик, а не напрямую на узел (аудит S-2):
# иначе всё, что держит nginx, для большинства клиентов (Tor включён
# по умолчанию) не действует. Onion пробрасывает TCP как есть: телефон
# видит тот же сертификат, что и без Tor, и пины совпадают.
#
# Только внутренний адрес: сюда ходит лишь контейнер onion.
server {
    listen 10.0.0.1:8444 ssl http2;
    server_name gasapp.example.com;

    ssl_certificate     /etc/gasapp/tls/public/fullchain.pem;
    ssl_certificate_key /etc/gasapp/tls/public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    access_log off;
    error_log /dev/null emerg;
    limit_req_log_level info;

    limit_conn gasapp_onion_conn 4000;
    limit_conn_status 429;

    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     60s;
    client_max_body_size  4m;

    include /etc/nginx/gasapp-upstream.inc;

    location = /health {
        return 404;
    }

    location = /v1/attachments/blob {
        limit_req zone=gasapp_onion_general burst=200 nodelay;
        limit_req_status 429;
        client_max_body_size 102m;
        # Через Tor стомегабайтный файл идёт дольше.
        client_body_timeout 300s;
        proxy_pass https://gasapp_nodes;
    }

    location ~ "^/v1/channels/own/[0-9a-f-]{36}/[0-9a-f-]{36}/media$" {
        limit_req zone=gasapp_onion_general burst=200 nodelay;
        limit_req_status 429;
        client_max_body_size 34m;
        # Через Tor тридцать мегабайт идут дольше.
        client_body_timeout 300s;
        proxy_pass https://gasapp_nodes;
    }

    location ~ "^/v1/(accounts/(email/code|register)|bots/register)$" {
        limit_req zone=gasapp_onion_signup burst=15 nodelay;
        limit_req_status 429;
        proxy_pass https://gasapp_nodes;
    }

    location ^~ /v1/discovery/ {
        limit_req zone=gasapp_onion_discovery burst=50;
        limit_req_status 429;
        proxy_pass https://gasapp_nodes;
    }

    location / {
        limit_req zone=gasapp_onion_general burst=200 nodelay;
        limit_req_status 429;
        proxy_read_timeout 3600s;
        proxy_pass https://gasapp_nodes;
    }
}
