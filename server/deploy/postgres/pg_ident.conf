#
# Сопоставление имени из сертификата клиента с ролью базы (VPS-4).
# Debian/Ubuntu: /etc/postgresql/16/main/pg_ident.conf — ЗАМЕНИТЬ целиком.
#
# Сертификат узла выпущен с CN = gasapp (internal-ca.sh client gasapp).
# После разделения ролей (аудит 2026-11-28, S-10) узел входит ролью
# gasapp_api — и только ею: строки «gasapp → gasapp» здесь нет, так что
# с сертификатом узла владельцем схемы не войти.

# MAPNAME       SYSTEM-USERNAME   PG-USERNAME
gasapp_nodes    gasapp            gasapp_api
