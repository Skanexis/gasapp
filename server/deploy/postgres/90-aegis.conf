#
# Настройка Postgres для AEGIS (VPS-4).
# Debian/Ubuntu: /etc/postgresql/16/main/conf.d/90-aegis.conf
# (основной postgresql.conf подключает conf.d сам).
#
# Сертификаты — из внутреннего центра (deploy/pki/internal-ca.sh):
#     internal-ca.sh server db aegis-db 10.0.0.4

# --- Сеть ------------------------------------------------------------------
# Собственные адреса сервера базы, а НЕ адреса узлов: кому можно
# подключаться, решают pg_hba.conf и брандмауэр.
listen_addresses = 'localhost,10.0.0.4'
port = 5432
max_connections = 200
authentication_timeout = 10s
tcp_keepalives_idle = 60
# Забытая транзакция держит блокировки и версии строк — в том числе
# строки конвертов, которые должны исчезнуть после доставки.
idle_in_transaction_session_timeout = 60s

# --- Пароли и TLS ----------------------------------------------------------
password_encryption = scram-sha-256

ssl = on
ssl_cert_file = '/etc/postgresql/aegis-tls/db.pem'
ssl_key_file  = '/etc/postgresql/aegis-tls/db.key'
# Центр, которым проверяются сертификаты КЛИЕНТОВ (clientcert=verify-full).
ssl_ca_file   = '/etc/postgresql/aegis-tls/ca.pem'
# Клиенты базы — только узлы AEGIS (rustls): старее TLS 1.3 им не нужно.
ssl_min_protocol_version = 'TLSv1.3'

# --- 🔐 Журнал без метаданных ---------------------------------------------
# Журнал базы — тоже журнал сервера, и изымается вместе с диском.
# В нём не должно быть ни адресов, ни имён, ни текста запросов.
#
# Без адресов клиента: подключаются только узлы, и строки
# «connection received: host=10.0.0.2» ничего не дают, кроме шума.
log_connections = off
log_disconnections = off
log_hostname = off
# Префикс без %h (адрес) и %u/%d — время и процесс достаточно.
log_line_prefix = '%m [%p] '
# Текст запроса при ошибке не пишется: в нём параметры.
log_min_error_statement = panic
log_statement = 'none'
log_min_duration_statement = -1
# 🔐 terse: без DETAIL. Именно в DETAIL Postgres пишет значения:
# «Key (username)=(alice) already exists» — имя, которое кто-то пытался
# занять, оседало бы в журнале.
log_error_verbosity = terse
log_checkpoints = off
log_lock_waits = off
log_temp_files = -1
log_autovacuum_min_duration = -1
