#
# Кто может подключаться к базе AEGIS (VPS-4).
# Debian/Ubuntu: /etc/postgresql/16/main/pg_hba.conf — ЗАМЕНИТЬ целиком.
#
# Первое совпадение решает. Всё, что не разрешено явно, отвергается
# последними строками.

# TYPE    DATABASE  USER      ADDRESS        METHOD

# Обслуживание и резервные копии: только системный postgres через сокет.
local     all       postgres                 peer

# Админ-центр на этой же машине: сокет, пароль.
local     aegis     aegis                    scram-sha-256

# 🔐 Узлы API: только TLS, пароль И сертификат клиента от внутреннего
# центра с CN = aegis (internal-ca.sh client aegis).
#
# Пароль, утёкший из резервной копии конфигурации или журнала, без
# ключа сертификата бесполезен — и наоборот.
hostssl   aegis     aegis     10.0.0.1/32    scram-sha-256  clientcert=verify-full
hostssl   aegis     aegis     10.0.0.2/32    scram-sha-256  clientcert=verify-full
hostssl   aegis     aegis     10.0.0.3/32    scram-sha-256  clientcert=verify-full

# Остальное — нет. Явно, чтобы случайная строка выше по ошибке
# (или из пакета по умолчанию) не открыла доступ.
host      all       all       0.0.0.0/0      reject
host      all       all       ::/0           reject
local     all       all                      reject
