#
# Postgres для разработки и интеграционных тестов.
#
# Запуск:
#   docker compose -f server/deploy/docker-compose.yml up -d
#
# Прогон тестов против него:
#   GASAPP_TEST_DATABASE_URL=postgres://gasapp:gasapp-dev@localhost:5433/gasapp \
#       cargo test -p gasapp-server-db
#
# Порт 5433, а не 5432: на машине разработчика часто уже стоит локальный
# Postgres, и конфликт портов проявился бы невнятной ошибкой подключения.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gasapp-postgres
    environment:
      # Пароль разработки. В продакшене секреты приходят из хранилища
      # секретов, а не из compose-файла.
      #
      # ⚠️ Здесь стояла ссылка «см. deploy/k8s» на каталог, которого
      # не существует: он пуст с момента создания. Манифесты
      # Kubernetes — открытая задача, и указывать на них как
      # на готовые значило обещать несуществующее.
      # Развёртывание, которое есть, описано в РАЗВЁРТЫВАНИЕ.md.
      POSTGRES_USER: gasapp
      POSTGRES_PASSWORD: gasapp-dev
      POSTGRES_DB: gasapp
    # 🔐 Только петля. Без адреса Docker публикует порт на всех
    # интерфейсах — и в обход брандмауэра хоста (свои правила iptables):
    # база с паролем из этого файла открывалась бы всей сети, в которой
    # стоит машина (аудит 2026-10-02, S-6).
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # Схема применяется при первом старте пустого тома.
      - ../migrations:/docker-entrypoint-initdb.d:ro
      - gasapp-pgdata:/var/lib/postgresql/data

volumes:
  gasapp-pgdata:
