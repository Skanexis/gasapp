# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "aegis-server-admin"
description = "Админ-центр оператора AEGIS: жалобы, счётчики, прозрачность — без данных о людях"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Формы входа и действий — `form`; поиск аккаунта — `query`.
axum = { workspace = true, features = ["form", "query"] }
sqlx.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "process"] }
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sha2.workspace = true
subtle.workspace = true
hex.workspace = true
rand = "0.8"

[dev-dependencies]
aegis-server-db.workspace = true
tower = { workspace = true, features = ["util"] }
