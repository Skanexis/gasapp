# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "aegis-server-api"
description = "REST API сервера AEGIS на axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aegis-server-db.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
axum-server.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
ed25519-dalek.workspace = true
curve25519-dalek.workspace = true
sha2.workspace = true
ml-dsa.workspace = true
rand_core.workspace = true
rand = "0.8"
subtle.workspace = true
hex.workspace = true

[dev-dependencies]
tokio-rustls.workspace = true
rcgen.workspace = true
# 🔐 TLS 1.2 включается только для проверки: клиент теста обязан уметь
# его предложить, иначе тест доказывал бы лишь то, что rustls собран
# без этой возможности, — а проверяется отказ сервера.
rustls = { workspace = true, features = ["tls12"] }
tower = { workspace = true, features = ["util"] }

[features]
# Открывает `Hub::connect_for_test` для интеграционных тестов.
#
# Фичей, а не `pub`: соединение обязано заводиться только обработчиком
# сокета, который снимает его при разрыве. Открытый метод позволил бы
# оставить в карте запись, которую никто не уберёт.
test-hub = []

# Тесты собираются с открытым доступом к хабу: интеграционная проверка
# межузловых уведомлений заводит соединение напрямую.
[dev-dependencies.aegis-server-api]
path = "."
features = ["test-hub"]
