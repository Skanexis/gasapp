# SPDX-License-Identifier: AGPL-3.0-only
#
# Серверный workspace — отдельный от клиентского (`crates/`).
#
# Разделение не организационное, а лицензионное: клиент распространяется
# под Apache-2.0 (иначе закрыт путь в App Store), сервер — под AGPL-3.0,
# чтобы никто не мог хостить модифицированный закрытый форк (ADR-006).
# Два workspace делают невозможным случайное попадание серверного кода
# в граф зависимостей клиента: `cargo` просто не видит их друг из друга.

[workspace]
resolver = "2"
members = [
    "gasapp-server-admin",
    "gasapp-server-api",
    "gasapp-server-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false
authors = ["The GasApp Authors"]
repository = "https://github.com/gasapp-messenger/gasapp"

[workspace.dependencies]
gasapp-server-db = { path = "gasapp-server-db" }

# Веб-слой.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false }
# TLS для axum.
#
# Нужен, потому что клиент запрещает открытый трафик:
# network_security_config.xml выставляет cleartextTrafficPermitted="false",
# и обычный HTTP приложение просто не пропустит. Отключать этот запрет
# ради удобства проверки нельзя — он и есть проверяемая защита.
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Таймер для таймаутов HTTP/1 (чтение заголовков): axum-server его не
# ставит, и без него умолчание hyper в 30 секунд не действует вовсе.
hyper-util = { version = "0.1", features = ["tokio"] }
# Версии — ровно те, что тянет axum-server: типы конфигурации общие,
# и расхождение версий их бы развело.
#
# 🔐 0.23.45 — не ниже: RUSTSEC-2026-0285 (сообщения рукопожатия TLS 1.3
# принимались через границы уровней шифрования) исправлен в 0.23.45.
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
# Только для проверки рукопожатия в тестах: клиент TLS и самоподписанный
# сертификат. В сервере их нет.
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws-lc-rs"] }
rcgen = "0.13"

# Хранилище.
# 🔐 `tls-rustls-aws-lc-rs`: TLS до Postgres (аудит 2026-10-02). Без него
# руководство требовало `sslmode=require` и `hostssl` — а драйвер TLS не
# умел: такой узел не подключался к базе, и оставался путь «убрать
# sslmode», то есть конверты и метаданные между машинами открытым
# текстом. Тот же поставщик криптографии, что у TLS самого узла.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

# Общее.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Криптография: сервер проверяет подписи и считает PoW, но не шифрует
# сообщения — он их не читает вовсе.
argon2 = "0.5"
ed25519-dalek = "2.1.1"
curve25519-dalek = "4.1.3"
sha2 = "0.10.8"
# HMAC для хеша адреса почты (миграция 0017): адрес в базе не лежит.
hmac = "0.12.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
subtle = "2.6.1"
hex = "0.4"
# ML-DSA-65 (FIPS 204): проверка подписи ключа восстановления аккаунта
# (модуль `recovery`). Та же реализация RustCrypto, что у клиента.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }

# Argon2id в отладочной сборке считается в сотни раз медленнее, чем
# в релизной: тесты proof-of-work без этого идут двумя минутами вместо
# секунды. Медленные тесты не запускают, а не запускаемый тест
# не отличается от отсутствующего — поэтому зависимости собираются
# с оптимизацией даже в debug.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
