// Корневой build-файл: объявляет плагины для всех модулей, но сам их
// не применяет (`apply false`).
//
// ⚠️ Раньше здесь стоял блок `android { ... }`, дублировавший конфигурацию
// из `app/build.gradle`. В корневом проекте, к которому не применён
// android-плагин, такой блок не имеет смысла и ронял любую задачу Gradle —
// в том числе `wrapper`, из-за чего wrapper так и не был сгенерирован,
// а сборка Android ни разу не запускалась.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
}
