plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk = 34

    defaultConfig {
        applicationId = "org.aegis.app"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Enable Java 8 language features
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }

    // Flavor dimensions
    flavorDimensions += "mode"

    productFlavors {
        gms {
            dimension = "mode"
            applicationIdSuffix = ".gms"
            // GMS-specific dependencies will go here
        }

        foss {
            dimension = "mode"
            applicationIdSuffix = ".foss"
            // FOSS-specific dependencies will go here
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    // SourceSets configuration
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }

        // Flavor-specific source sets
        gms {
            java.srcDirs = ['src/gms/java', 'src/gms/kotlin']
            res.srcDirs = ['src/gms/res']
            assets.srcDirs = ['src/gms/assets']
        }

        foss {
            java.srcDirs = ['src/foss/java', 'src/foss/kotlin']
            res.srcDirs = ['src/foss/res']
            assets.srcDirs = ['src/foss/assets']
        }
    }

    // Packaging options
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Flavor-specific dependencies
    gmsImplementation 'com.google.android.gms:play-services-auth:20.4.1'
    gmsImplementation 'com.google.firebase:firebase-messaging:23.2.1'

    fossImplementation 'io.github.privacy-secure-webservices:open-keychain:4.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Snapshot-тесты. Paparazzi подключается плагином `app.cash.paparazzi`,
    // а не как обычная зависимость: он рендерит вью на JVM без эмулятора.
    // Раньше здесь стояла координата `com.github.paparoni:paparazzi`, которой
    // не существует, — сборка Gradle ни разу не запускалась и не поймала это.
    testImplementation 'app.cash.paparazzi:paparazzi:1.3.5'
}