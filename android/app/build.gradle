plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/**
 * SHA-256 сертификата подписи релиза в шестнадцатеричном виде.
 *
 * Порядок: явное `gasappSigningCertSha256` (подпись вне этой машины,
 * например в HSM) → сертификат ключа `gasappKeyAlias` из `gasappKeystore`
 * → пусто. Пусто означает «проверка подписи выключена», и центр
 * безопасности говорит это вслух.
 */
def releaseSigningCertSha256() {
    if (project.hasProperty('gasappSigningCertSha256')) {
        return project.property('gasappSigningCertSha256').toString()
                .replace(':', '').trim().toLowerCase()
    }

    if (!project.hasProperty('gasappKeystore')) {
        return ''
    }

    def store = java.security.KeyStore.getInstance(
            file(project.property('gasappKeystore')),
            project.property('gasappKeystorePassword').toString().toCharArray())
    def cert = store.getCertificate(project.property('gasappKeyAlias').toString())

    if (cert == null) {
        throw new GradleException("в gasappKeystore нет ключа gasappKeyAlias")
    }

    return java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
}

// Релиз разбивается на APK по архитектурам (см. `splits`).
//
// ⚠️ Кроме сборки AAB (`bundle…`): Google Play делит её по устройствам
// сам, а AGP с включёнными `splits` падает на `buildGmsReleasePreBundle`
// («Sequence contains more than one matching element») — AAB для
// магазина не собиралась вовсе (найдено 2026-09-30).
def releaseAbiSplit = gradle.startParameter.taskNames.any {
    def task = it.toLowerCase()
    task.contains('release') && !task.contains('bundle')
}

android {
    // Обязателен начиная с AGP 8: пакет, в котором генерируется класс R.
    // Без него конфигурация проекта падает ещё до сборки.
    namespace = "org.gasapp.app"
    compileSdk = 36

    // 🔐 Версия NDK закреплена — раздел 19.2, пункт «.so не содержит
    // debug-символов в release», и ADR-020 (воспроизводимость).
    //
    // Без этой строки AGP не находит NDK и молча пропускает задачу
    // `stripReleaseDebugSymbols`, сообщая об этом одной строкой в логе:
    // «Unable to strip the following libraries, packaging them as they
    // are: libgasapp.so, libjnidispatch.so». Сборка при этом успешна.
    // В APK уезжала libgasapp.so с .symtab на 34 тысячи записей —
    // полными именами функций ядра, от `pqxdh_initiate` до
    // `double_ratchet_decrypt`.
    //
    // Rust срезать их не может: `strip = "symbols"` в Cargo.toml убрал бы
    // вместе с ними метаданные UNIFFI_META_*, и биндинги перестали бы
    // генерироваться (см. комментарий в crates/Cargo.toml). `strip` из NDK
    // различает таблицы: убирает .symtab, оставляет .dynsym — то есть
    // ровно то, что нужно.
    //
    // Версия именно точная: `strip` разных NDK даёт разный байт-в-байт
    // результат, а воспроизводимая сборка (M8) требует совпадения APK.
    //
    // ⚠️ Обязана совпадать с NDK_VERSION в tools/Dockerfile.android
    // (r27c = 27.2.12479018). Там собирается сама libgasapp.so, здесь она
    // обрезается — то есть обе версии участвуют в одном артефакте.
    // Прежде они расходились: контейнер собирал r27c, Gradle требовал
    // 29.0.14206865 (к тому же preview-выпуск). Совпадение проверяет
    // tools/check-ndk-pins.sh.
    ndkVersion = "27.2.12479018"

    defaultConfig {
        applicationId = "org.gasapp.app"

        // 🔐 minSdk = 28, как требует раздел 19.2 плана.
        //
        // Стояло 21 — и это расходилось не только с планом, но и с
        // `tools/build-rust-android.sh`, который собирает .so под API 28.
        // На API < 28 в Android Keystore нет `setUnlockedDeviceRequired`
        // и нет StrongBox, то есть схема KEK/DEK (ADR-017) на таких
        // устройствах держалась бы на ключе, доступном при заблокированном
        // экране. Приложение при этом ставилось и выглядело работающим:
        // заявленная аппаратная защита просто отсутствовала.
        minSdk = 28

        // 🔐 targetSdk = 36 (Android 16).
        //
        // targetSdk — это не «где запускается», а «какие ограничения
        // платформы приложение на себя принимает». На 34 система применяла
        // бы к нему послабления совместимости: часть ограничений на фоновый
        // запуск и на доступ к буферу обмена из фона действует только
        // начиная с 35.
        //
        // 36 — требование Google Play к новым приложениям с 2026-08-31.
        // Что меняется: от края до края без возможности отказа (уже так,
        // `ui/SafeArea`), предиктивный «назад» (обработчики — через
        // OnBackPressedDispatcher), на больших экранах система игнорирует
        // запреты поворота и размера (раскладки уже адаптивные).
        // minSdk при этом прежний: магазины требуют SDK сборки, а не
        // минимальную версию системы.
        targetSdk = 36

        // Адрес сервера как поле сборки.
        //
        // 🔐 Вынесено сюда, а не в код: отладочная и релизная сборки
        // не должны иметь возможности случайно указать на один сервер.
        // Значение по умолчанию — локальная сеть для проверки на двух
        // устройствах; релиз обязан переопределить его.
        buildConfigField "String", "GASAPP_SERVER_URL",
                "\"${project.findProperty('gasappServerUrl') ?: 'https://10.0.2.2:8443'}\""
        // Onion-сервис сервера (`адрес.onion:порт`, см.
        // server/deploy/onion): в режиме Tor соединения к серверу идут
        // туда, без выходного узла. Пусто — через выходной узел.
        //
        // 🔐 Задаётся сборкой, а не сервером: подменить адрес сервер
        // не может, а TLS и пиннинг к домену сервера остаются в силе.
        buildConfigField "String", "GASAPP_SERVER_ONION",
                "\"${project.findProperty('gasappServerOnion') ?: ''}\""
        // 🔐 Эталон подписи для проверки во время работы (MASVS
        // RESILIENCE-2.1, `core/AppSignature.kt`). Пусто в отладочной
        // сборке: подписывать её нашим ключом никто не будет, и сверять
        // не с чем. Релиз переопределяет поле ниже.
        buildConfigField "String", "SIGNING_CERT_SHA256", "\"\""

        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Четыре ABI — ровно те, под которые `tools/build-rust-android.sh`
        // собирает libgasapp.so.
        //
        // Без фильтра в APK попадало семь: JNA поставляет libjnidispatch.so
        // ещё под mips, mips64 и armeabi — архитектуры, выброшенные из NDK
        // в r17 и не встречающиеся на живых устройствах с API 28+.
        //
        // Помимо лишнего веса это было и дырой в обрезке символов: strip
        // из NDK для mips не существует, и именно эти три библиотеки
        // задача `stripReleaseDebugSymbols` пропускала с предупреждением,
        // упаковывая их с полной таблицей символов.
        //
        // При разбиении релиза по ABI (блок `splits` ниже) фильтр снимается:
        // AGP не допускает обоих сразу. Мёртвые ABI JNA тогда вырезает
        // `packaging.jniLibs.excludes`.
        if (!releaseAbiSplit) {
            ndk {
                abiFilters += ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86']
            }
        }
    }

    // APK по архитектурам — только для релиза.
    //
    // Универсальный APK везёт ядро под все четыре ABI (29 МБ), хотя
    // телефону нужно одно (≈10 МБ для arm64). Рядом собирается и
    // универсальный — для тех, кто не знает архитектуру своего телефона.
    // Отладочные сборки остаются одним файлом: их ставят руками
    // и инструментальными тестами по известному пути.
    splits {
        abi {
            enable releaseAbiSplit
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk true
        }
    }

    // compileOptions и kotlinOptions — блоки уровня `android`, а не
    // `defaultConfig`. Вложенные внутрь defaultConfig они игнорировались.
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Flavor dimensions
    flavorDimensions += "mode"

    productFlavors {
        gms {
            dimension = "mode"
            applicationIdSuffix = ".gms"
            // GMS-specific dependencies will go here
        }

        foss {
            dimension = "mode"
            applicationIdSuffix = ".foss"
            // FOSS-specific dependencies will go here
        }
    }

    buildFeatures {
        // buildConfig отключён по умолчанию начиная с AGP 8: без явного
        // включения сгенерированный BuildConfig не появляется, и
        // обращение к GASAPP_SERVER_URL не компилируется.
        buildConfig = true
    }

    // 🔐 Подпись релиза (раздел 26.3, пункт M8 «Подпись релизов + публикация
    // SHA-256»).
    //
    // Все четыре значения приходят из свойств Gradle — из ~/.gradle/gradle.properties
    // или из переменных окружения CI. В репозитории нет ни ключа, ни пароля;
    // gitleaks проверяет это на каждом PR.
    signingConfigs {
        release {
            if (project.hasProperty('gasappKeystore')) {
                storeFile = file(project.property('gasappKeystore'))
                storePassword = project.property('gasappKeystorePassword')
                keyAlias = project.property('gasappKeyAlias')
                keyPassword = project.property('gasappKeyPassword')

                // v1 (JAR signing) выключена намеренно.
                //
                // 🔐 minSdk = 28, а v2 существует с API 24: v1 не нужна ни
                // одному поддерживаемому устройству, зато она уязвима к
                // Janus-подобным подменам и оставляет в APK второй, более
                // слабый путь проверки подписи.
                enableV1Signing = false

                // ⚠️ На деле APK подписан **только v3**: при minSdk 28 AGP
                // не кладёт блок v2, хотя он здесь разрешён (проверено
                // `apksigner verify -v`: v2 false, v3 true). Для устройств
                // с API 28+ этого достаточно — они проверяют v3, — и v3
                // сильнее: поддерживает ротацию ключа подписи.
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            // 🔐 R8 с обфускацией — раздел 19.2 и MASVS CODE-2/RESILIENCE-4.
            //
            // Стояло `false`, при том что строкой ниже уже перечислялись
            // proguardFiles, а файла 'proguard-rules.pro' вообще не
            // существовало: конфигурация выглядела настроенной и не
            // выполнялась. Релизный APK отдавал имена классов и методов
            // как есть — `LockActivity.verifyPin`, `Core.open` — то есть
            // карту приложения тому, кто его вскрывает.
            //
            // ⚠️ Обфускация ≠ безопасность (прямая оговорка раздела 25).
            // Она не защищает ни ключи, ни протокол; она лишь поднимает
            // цену первого прохода по коду. Настоящие меры — memory safety
            // ядра и воспроизводимость сборки.
            minifyEnabled true

            // Удаление неиспользуемых ресурсов. Помимо размера это убирает
            // из APK строки и разметку черновых экранов, по которым видно
            // незавершённые функции.
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            // 🔐 Явное `false`, а не умолчание.
            //
            // AGP и так не делает релиз отлаживаемым, но пункт раздела 19.2
            // требует именно проверяемого запрета: строка в файле сборки
            // видна в ревью, умолчание — нет.
            debuggable false

            // 🔐 Не прикладывать таблицу символов libgasapp.so к бандлу.
            //
            // Обрезает .so в самом APK задача AGP `stripDebugSymbols`
            // (она вызывает strip из NDK и работает в release всегда);
            // Rust-профиль release срезает debuginfo ещё раньше. Эта же
            // строка отвечает за другое — за отдельный архив символов,
            // который AGP иначе прикладывает к .aab для Play Console.
            //
            // 'NONE', потому что архив символов Play раздаёт в составе
            // отчётов о падениях. Осмысленные трассировки нативных
            // падений — вещь полезная, но в обмен на публикацию карты
            // libgasapp.so, а ядро здесь — то, что защищает переписку.
            ndk {
                debugSymbolLevel = 'NONE'
            }

            // Подпись релиза берётся из свойств Gradle, а не из файла
            // в репозитории (раздел 26): ключ в дереве исходников — это
            // ключ, утёкший вместе с первым клоном.
            //
            // Без свойств блок не объявляется вовсе: пустой signingConfig
            // заставил бы AGP подписать релиз отладочным ключом и выдать
            // его за подписанный.
            if (project.hasProperty('gasappKeystore')) {
                signingConfig signingConfigs.release
            }

            // 🔐 SHA-256 сертификата, которым подписывается этот релиз.
            // Берётся из того же хранилища ключей, что и подпись, —
            // вписать руками значение, расходящееся с ключом, нельзя.
            buildConfigField "String", "SIGNING_CERT_SHA256", "\"${releaseSigningCertSha256()}\""
        }
        debug {
            minifyEnabled false

            // Отладочная сборка ставится рядом с релизной, а не поверх неё.
            //
            // 🔐 Иначе установка отладочного APK на устройство с релизным
            // затирала бы боевую базу: applicationId совпадает, и система
            // считает это обновлением.
            applicationIdSuffix = ".debug"
        }
    }

    // SourceSets configuration
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            // Встроенные мосты Tor — генерируются задачей gasappBridges.
            assets.srcDirs = ['src/main/assets', "$buildDir/generated/gasapp-bridges"]
        }

        // Flavor-specific source sets
        gms {
            java.srcDirs = ['src/gms/java', 'src/gms/kotlin']
            res.srcDirs = ['src/gms/res']
            assets.srcDirs = ['src/gms/assets']
        }

        foss {
            java.srcDirs = ['src/foss/java', 'src/foss/kotlin']
            res.srcDirs = ['src/foss/res']
            assets.srcDirs = ['src/foss/assets']
        }
    }

    // Packaging options
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }

        // ABI, выброшенные из NDK в r17: JNA везёт под них библиотеки,
        // strip для них не существует (см. `abiFilters` выше).
        jniLibs {
            excludes += ['lib/mips/**', 'lib/mips64/**', 'lib/armeabi/**']
        }
    }

    // Проверки lint.
    //
    // `lintRelease` проходит без ошибок, и это состояние удерживается
    // явно: `abortOnError` роняет сборку проверок, а группа
    // доступности поднята до ошибки — раздел 22 требует полного
    // покрытия accessibility, а предупреждение, которое ничего
    // не роняет, покрытием не становится.
    lint {
        abortOnError = true
        warningsAsErrors = false

        error += [
            // Текст мельче 11sp не читается при слабом зрении
            // и не увеличивается системной настройкой размера.
            'SmallSp',
            // Элемент без описания недоступен для чтения с экрана.
            'ContentDescription',
            // Метка, не связанная с полем, не зачитывается вместе с ним.
            'LabelFor',
            // Свой onTouch без performClick ломает озвучивание нажатий.
            'ClickableViewAccessibility',
            // Элемент, до которого нельзя добраться с клавиатуры,
            // недоступен и переключателю (switch access).
            'KeyboardInaccessibleWidget',
        ]

        // ⚠️ Размер цели нажатия lint не проверяет: `TouchTargetSizeCheck`
        // живёт в Accessibility Scanner, а не здесь, и id с таким
        // именем lint не знает (проверено — он отвечает `UnknownIssueId`).
        // Проверка 48dp остаётся ручной, на устройстве.

        // Отчёт в формате, который читает человек, и в формате,
        // который читает CI.
        htmlReport = true
        textReport = true
    }

    testOptions {
        unitTests {
            // Без этого флага Robolectric не видит ресурсы приложения:
            // конструктор любого компонента падает на setBackgroundResource
            // с Resources$NotFoundException, потому что selector'ы из
            // res/drawable в classpath тестов не попадают.
            includeAndroidResources = true

            // Логи Android в JVM-тестах пишутся в stdout, а не глотаются.
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 🔐 Биометрическая разблокировка (MASVS AUTH-2.1).
    //
    // Библиотека нужна ради `BiometricPrompt`: он единственный способ
    // получить `Cipher`, которым Keystore разрешит работать после
    // подтверждения. Свой диалог поверх `FingerprintManager` такого
    // не даёт — и сам по себе был бы ровно тем «рисунком поверх
    // незапертой двери», от которого защищает
    // `setUserAuthenticationRequired`.
    //
    // AndroidX, не Google Play Services: сборка `foss` обязана
    // оставаться свободной от проприетарных сервисов (раздел 18.2),
    // и это проверяет `tools/check-foss-apk.sh`.
    implementation 'androidx.biometric:biometric:1.1.0'

    // Встроенный сканер QR: добавление контакта и сверка safety number
    // по коду собеседника. CameraX — AndroidX (не Google Play Services,
    // годится для foss), ZXing core — Apache-2.0, чистая Java без сети.
    // 🔐 Кадры не покидают процесс: разбор на устройстве, без облака —
    // в отличие от системной камеры и Google Lens, которые видели бы
    // содержимое кода (имя и ключ). 1.4.x — последняя ветка под Kotlin 1.9.
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.zxing:core:3.5.3'

    // JNA — обязательна для биндингов UniFFI: сгенерированный gasapp.kt
    // обращается к нативной библиотеке через com.sun.jna. Классификатор
    // `@aar` важен: обычный jar не содержит нативных частей JNA под Android,
    // и приложение падало бы при первом вызове ядра.
    //
    // 🔴 Не ниже 5.17: в 5.14 libjnidispatch.so под x86_64 собрана
    // с выравниванием 4 КБ, а Google Play с ноября 2025 не принимает
    // приложения под Android 15+ с 64-битными библиотеками, не
    // готовыми к страницам 16 КБ. Проверяется в CI по собранному APK
    // (tools/check-so-hardening.sh, выравнивание LOAD).
    implementation 'net.java.dev.jna:jna:5.19.1@aar'

    // Зависимости flavor'ов.
    //
    // ⚠️ Для gms они появятся в M4 вместе с реальным подключением FCM
    // (`play-services-base`, `firebase-messaging`). Пока их нет намеренно:
    // тянуть Play Services в сборку, которая ими не пользуется, значит
    // раздувать APK и без нужды расширять поверхность доверия.
    //
    // Для foss зависимостей нет и не будет: этот flavor обязан оставаться
    // свободным от проприетарных сервисов (раздел 18.2). Раньше здесь
    // стояла координата `io.github.privacy-secure-webservices:open-keychain`,
    // которой не существует в природе, — Gradle ни разу не запускался
    // и не поймал это.

    testImplementation 'junit:junit:4.13.2'
    // Robolectric — чтобы тесты вью выполнялись на JVM без эмулятора:
    // компоненты дизайн-системы наследуют View и требуют Context.
    // 4.14.1, а не 4.13: в 4.13 максимальный поддерживаемый SDK — 34,
    // и после подъёма targetSdk до 35 (раздел 19.2) каждый тест падал
    // ещё до запуска с «Package targetSdkVersion=35 > maxSdkVersion=34».
    // 4.16 — та же история с targetSdk 36 (Android 16): у 4.14 предел 35.
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Инструментальный тест FFI ходит по экрану через UiAutomator.
    // Зависимость отсутствовала, из-за чего тест не компилировался
    // и ни разу не выполнялся — то есть не отличался от отсутствующего.
    //
    // Версия 2.2.0, а не 2.3.x: последняя собрана под более высокий
    // baseline и не проходит dex при `minSdk = 21`.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    // ActivityScenario запускает экран напрямую, без тапов по координатам:
    // ручной ввод оставляет состояние прошлой попытки и делает тест лживым.
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
// 🔐 Релиз не собирается с заглушками.
//
// Без этой проверки `assembleGmsRelease` без свойств давал APK, который
// выглядел готовым и не работал ни у кого:
// * адрес сервера по умолчанию — `https://10.0.2.2:8443`, то есть адрес
//   хоста из эмулятора;
// * пины сертификата в release/res/xml/network_security_config.xml —
//   заглушки `AAAA…=` и `BBBB…=`: соединение с настоящим сервером
//   отвергалось бы, а пункт MASVS NETWORK-2.1 при этом стоял ✅
//   («два разных пина» — две разные заглушки);
// * ключа подписи нет — APK неподписан.
//
// Для проверочной сборки на стенде (R8, запуск на эмуляторе) проверка
// снимается явно: -PgasappAllowUnreleasable=true. Случайно так не выйдет.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|package)\w*Release/
    }

    if (!releasing || project.hasProperty('gasappAllowUnreleasable')) {
        return
    }

    def problems = []

    if (!project.hasProperty('gasappServerUrl')) {
        problems << "не задан gasappServerUrl — релиз указал бы на 10.0.2.2"
    }

    def pins = file('src/release/res/xml/network_security_config.xml').text
    if (pins.contains('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=') ||
            pins.contains('BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=')) {
        problems << "пины сертификата в release/res/xml/network_security_config.xml — заглушки"
    }

    if (!project.hasProperty('gasappKeystore')) {
        problems << "не задан gasappKeystore — APK вышел бы неподписанным"
    }

    if (!problems.isEmpty()) {
        throw new GradleException(
            "Релиз не собирается:\n  • " + problems.join("\n  • ") +
                "\nДля проверочной сборки на стенде: -PgasappAllowUnreleasable=true"
        )
    }
}

// Встроенные мосты Tor (WebTunnel), строка на мост.
//
// По умолчанию — android/tor/bridges.txt из репозитория. Свои мосты,
// которые не стоит светить в открытом репозитории (их адреса
// блокировщики собирали бы оттуда), подставляются при сборке:
//   ./gradlew assembleRelease -PgasappBridgesFile=/путь/к/bridges.txt
// Строки проверяет ядро при запуске Tor; негодная отбрасывается,
// а не ломает Tor целиком.
def gasappBridgesSource = file(project.findProperty('gasappBridgesFile') ?: "${rootDir}/tor/bridges.txt")
def gasappBridgesOut = file("$buildDir/generated/gasapp-bridges/tor")

tasks.register('gasappBridges') {
    inputs.file(gasappBridgesSource).optional()
    outputs.dir(gasappBridgesOut)
    doLast {
        gasappBridgesOut.mkdirs()
        def text = gasappBridgesSource.exists() ? gasappBridgesSource.getText('UTF-8') : ''
        new File(gasappBridgesOut, 'bridges.txt').setText(text, 'UTF-8')
    }
}

preBuild.dependsOn('gasappBridges')
