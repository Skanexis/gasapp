# SDK по умолчанию для тестов Robolectric — тот же, что у @Config(sdk = [34])
# в остальных классах. Без него Robolectric берёт targetSdk (36), а среде
# Android 16 нужна Java 21: на Java 17 пять классов без @Config падали ещё
# до запуска (UnsupportedOperationException в DefaultSdkProvider).
# Android 16 проверяется явно — @Config(sdk = [34, 36]) в MonospaceKeysTest,
# и джоб юнит-тестов идёт на Java 21 (security.yml).
sdk=34
