# Файл отсутствовал: Gradle в этом проекте ни разу не запускался, поэтому
# обязательные для AndroidX флаги никто не выставил.

# AndroidX обязателен для всех современных зависимостей (androidx.*,
# material). Без флага сборка падает на checkAarMetadata.
android.useAndroidX=true

# Автоматическая замена старых support-библиотек на AndroidX не нужна:
# прямых зависимостей от com.android.support в проекте нет, а включённый
# jetifier заметно замедляет сборку.
android.enableJetifier=false

# Kotlin-компилятор в отдельном процессе — иначе на больших сборках
# демон Gradle упирается в память.
kotlin.compiler.execution.strategy=in-process

# 2 ГБ достаточно для этого модуля; значение зафиксировано явно, чтобы
# сборка вела себя одинаково на машине разработчика и в CI (ADR-020).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей. Сейчас модуль один, но флаг фиксируется
# заранее, чтобы поведение не менялось при добавлении второго.
org.gradle.parallel=true

# Не собирать то, что не изменилось.
org.gradle.caching=true
