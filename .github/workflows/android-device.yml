# SPDX-License-Identifier: Apache-2.0
#
# Проверки на эмуляторе Android (android/app/src/androidTest).
#
# Robolectric подменяет окна своими тенями. Крах панели действий
# в PhoneWindow.requestFeature модульные тесты увидели лишь случайно,
# а проверки на устройстве до этой правки не запускал никто: две из трёх
# в androidTest падали на каждом прогоне — ждали демонстрационных данных
# и экрана, который сторож блокировки давно закрывает, — и этого никто
# не видел.
#
# Нужна нативная библиотека: NativeCoreOnDeviceTest проверяет, что ядро
# загружается и считает на ART. Собирается тем же закреплённым
# контейнером, что и релиз, — только под x86_64, ABI эмулятора.
#
# Эмулятор в CI дорог (десятки минут), поэтому не на каждый PR:
# по main, ночью и вручную.

name: android-device

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    name: instrumentation tests on an emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # Две крайние версии: minSdk (28) — самая старая, на которой
    # приложение ставится, и targetSdk (36, Android 16) — ограничения,
    # которые мы на себя приняли. Промежуточные ломаются реже крайних.
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: build core for the emulator ABI in the pinned container
        run: |
          docker build -f tools/Dockerfile.android -t aegis-android tools/
          docker run --rm -v "$PWD":/work -w /work aegis-android \
            tools/build-rust-android.sh --abi x86_64

      # 🔐 CODE-2.5 на той библиотеке, что поедет на эмулятор.
      - name: check native hardening
        run: |
          docker run --rm -v "$PWD":/work -w /work aegis-android \
            bash tools/check-so-hardening.sh

      # Аппаратное ускорение: без KVM эмулятор за разумное время
      # не загрузится.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # foss: без Google Play Services на образе эмулятора. Экрану входа
      # нужен только файл базы — его ставит правило StandInAccount,
      # так что тесты не зависят от состояния устройства.
      - name: instrumentation tests (foss flavor)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --console=plain :app:connectedFossDebugAndroidTest -PaegisAllowUnreleasable=true
