# Автоматическая проверка правил безопасности из раздела 4 главного документа.
#
# Задача этого workflow — сделать так, чтобы правила не зависели от памяти
# и внимательности ревьюера. Каждая проверка соответствует конкретному пункту
# AEGIS_MASTER_PLAN.md.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Ежедневно: новые advisory появляются и без наших коммитов
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  #  Секреты в коде и в истории коммитов
  # --------------------------------------------------------------------------
  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks должен видеть всю историю
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  #  Лицензии, баны, уязвимости зависимостей
  # --------------------------------------------------------------------------
  supply-chain:
    name: supply chain (deny + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # 🔴 Главная юридическая проверка проекта.
      #    Copyleft в клиентском графе = невозможность публикации в App Store.
      - name: cargo-deny (client workspace)
        run: cargo deny --manifest-path crates/Cargo.toml check

      - name: cargo-audit
        run: cargo audit --file crates/Cargo.lock

  # --------------------------------------------------------------------------
  #  Правило 1: UI не занимается криптографией
  # --------------------------------------------------------------------------
  no-crypto-in-ui:
    name: rule 1 — no crypto in UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-no-crypto-in-ui.sh

  # --------------------------------------------------------------------------
  #  Правило 7: нет телеметрии и аналитики
  # --------------------------------------------------------------------------
  no-telemetry:
    name: rule 7 — no analytics SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-no-telemetry.sh

  # --------------------------------------------------------------------------
  #  ADR-020: версия NDK закреплена одинаково в двух местах
  # --------------------------------------------------------------------------
  ndk-pins:
    name: "adr-020 — ndk pins agree"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-ndk-pins.sh

  # --------------------------------------------------------------------------
  #  Сводка чек-листа MASVS совпадает с его строками
  #
  #  Сводная таблица в конце чек-листа — то самое место, где документ
  #  расходится сам с собой: строку переводят из 🟡 в ✅ и забывают
  #  про итог. Числа пересчитываются из источника.
  # --------------------------------------------------------------------------
  masvs-summary:
    name: MASVS summary matches its own rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/masvs-summary.py --check

  # --------------------------------------------------------------------------
  #  Каждая настройка на что-то влияет
  #
  #  Переключатель, который ничего не переключает, врёт в обе стороны:
  #  включивший строит поведение на том, что функция работает,
  #  выключивший — на том, что она отключена.
  # --------------------------------------------------------------------------
  settings-are-used:
    name: every setting has a reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-settings-are-used.sh

  # --------------------------------------------------------------------------
  #  Каждый исходник лежит в репозитории
  #
  #  Правило `core.*` в .gitignore (для дампов памяти) съедало
  #  `org/aegis/app/core/Core.kt` — единственное место, где собирается
  #  ключ базы. Файл не попадал в репозиторий ни разу за всю историю:
  #  локально он на месте, а git про игнорируемое молчит.
  # --------------------------------------------------------------------------
  sources-tracked:
    name: every source file is in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-sources-tracked.sh

  # --------------------------------------------------------------------------
  #  Спецификация протокола не разошлась с реализацией
  #
  #  Метки разделения доменов и числовые параметры — константы. Разойдись
  #  метка на символ, и чужая реализация выведет другие ключи из тех же
  #  секретов: рукопожатие пройдёт, сообщение не расшифруется.
  # --------------------------------------------------------------------------
  protocol-spec:
    name: spec agrees with the implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-protocol-spec.py

  # --------------------------------------------------------------------------
  #  Раздел 18.2: в сборке foss нет ни одного класса Google
  #
  #  Проверяется собранный APK, а не исходники: классы приносят
  #  транзитивные зависимости и плагины Gradle — места, куда никто
  #  не смотрит. `check-no-telemetry.sh` ищет по `src/` и этого не видит.
  # --------------------------------------------------------------------------
  foss-apk:
    name: "18.2 — no Google classes in the foss build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Нативной библиотеки в репозитории нет, и собирать её здесь
      # незачем: проверка смотрит на DEX, а не на .so. Gradle
      # соберёт APK без jniLibs — классы Java от этого не изменятся.
      - name: assemble foss release
        working-directory: android
        run: ./gradlew --console=plain -q :app:assembleFossRelease -PaegisAllowUnreleasable=true

      - run: bash tools/check-foss-apk.sh

  # --------------------------------------------------------------------------
  #  Тесты и lint приложения
  #
  #  Прежде CI не запускал ни одного теста Android: из приложения
  #  собирался только APK foss. Проверки `hardening/` — автоблокировка,
  #  запрет снимков, PIN, File Vault, открытие всех экранов и панелей —
  #  шли только на машине разработчика, и регресс в них CI пропускал.
  #  Так месяц простояла панель действий, ронявшая приложение при каждом
  #  открытии (ActionSheetOpensTest).
  #
  #  Нативная библиотека тестам не нужна: Robolectric проверяет слой
  #  Android, а обращения к ядру без неё отвечают ошибкой, которую
  #  приложение обрабатывает.
  # --------------------------------------------------------------------------
  android-tests:
    name: android unit tests and lint (both flavors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: unit tests and release lint
        working-directory: android
        run: >-
          ./gradlew --console=plain
          :app:testGmsDebugUnitTest :app:testFossDebugUnitTest
          :app:lintGmsRelease :app:lintFossRelease
          -PaegisAllowUnreleasable=true

  # --------------------------------------------------------------------------
  #  Перевод не разошёлся с оригиналом
  #
  #  Недостающая строка молча подменяется языком по умолчанию, а лишний
  #  спецификатор формата роняет приложение — но только у того, кто выбрал
  #  этот язык. Ни сборка, ни lint этого не видят.
  # --------------------------------------------------------------------------
  strings-parity:
    name: translations agree with the default locale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-strings-parity.py

  # --------------------------------------------------------------------------
  #  У каждого элемента разметки есть размер
  #
  #  Семь экранов падали при открытии: у TextView не было layout_height,
  #  а стиль его не задавал. Lint (RequiredSize) доверяет стилю и молчит;
  #  здесь цепочка стилей разбирается по-настоящему.
  # --------------------------------------------------------------------------
  layout-sizes:
    name: every layout element has a size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-layout-sizes.py

  # --------------------------------------------------------------------------
  #  Каждая функция, выведенная через FFI, вызывается приложением
  #
  #  Самый частый дефект проекта: механизм написан, покрыт тестами,
  #  выведен через FFI — и не вызывается. Тесты зелёные, продукт его
  #  не содержит. Исключения перечислены в скрипте, каждое с причиной.
  # --------------------------------------------------------------------------
  ffi-exports-used:
    name: every FFI export is called by the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-ffi-exports-used.py

  # --------------------------------------------------------------------------
  #  Каждое событие журнала безопасности подписано
  #
  #  Журнал писался, но прочитать его было негде. Теперь он показывается
  #  в центре безопасности; событие без подписи появиться незаметно
  #  не должно, а подпись к событию, которого ядро не пишет, обещает
  #  то, чего не происходит.
  # --------------------------------------------------------------------------
  security-events-labelled:
    name: every security event has a label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-security-events-labelled.py

  # --------------------------------------------------------------------------
  #  MASVS STORAGE-2: секреты не попадают в журнал
  # --------------------------------------------------------------------------
  no-secrets-in-logs:
    name: "masvs storage-2 — no secrets in logs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-no-secrets-in-logs.sh

  # --------------------------------------------------------------------------
  #  unsafe разрешён только в aegis-ffi
  # --------------------------------------------------------------------------
  unsafe-boundary:
    name: unsafe only in aegis-ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check unsafe_code lint is forbidden outside aegis-ffi
        run: |
          set -euo pipefail
          violations=0
          for manifest in crates/*/Cargo.toml; do
            crate=$(basename "$(dirname "$manifest")")
            [ "$crate" = "aegis-ffi" ] && continue
            if grep -q 'unsafe_code *= *"allow"' "$manifest"; then
              echo "::error file=$manifest::crate '$crate' allows unsafe_code; only aegis-ffi may"
              violations=$((violations + 1))
            fi
          done
          # Ручной unsafe вне aegis-ffi невозможен из-за forbid в workspace,
          # но проверяем и текстово — на случай локального override.
          if grep -rn --include='*.rs' 'unsafe *{' crates/ | grep -v '^crates/aegis-ffi/'; then
            echo "::error::unsafe block found outside aegis-ffi"
            violations=$((violations + 1))
          fi
          exit $violations

  # --------------------------------------------------------------------------
  #  Дизайн-токены должны совпадать с UI kit
  #
  #  UI kit — источник правды по дизайну (раздел 20). Расхождение между ним
  #  и сгенерированными токенами незаметно глазом («цвет почти тот же»),
  #  поэтому проверяется машиной.
  # --------------------------------------------------------------------------
  design-tokens:
    name: tokens match UI kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/gen-tokens.mjs --check

  # --------------------------------------------------------------------------
  #  Pre-commit hooks validation
  # --------------------------------------------------------------------------
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  # --------------------------------------------------------------------------
  #  AGPL-код не должен попадать в клиентскую сборку (ADR-006)
  # --------------------------------------------------------------------------
  license-separation:
    name: no AGPL crate in client graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: server crates must not appear in client dependency graph
        run: |
          set -euo pipefail
          graph=$(cargo tree --manifest-path crates/Cargo.toml --prefix none --no-dedupe 2>/dev/null || true)
          if echo "$graph" | grep -E '^aegis-server'; then
            echo "::error::a server crate (AGPL-3.0) reached the client dependency graph."
            echo "This makes App Store publication legally impossible. See ADR-006."
            exit 1
          fi
          echo "OK: client graph contains no server crates"
