name: fuzz

# Фаззинг идёт по ночам, а не на каждый push: один осмысленный прогон
# занимает часы, и держать на нём пайплайн пул-реквестов бессмысленно.
#
# На пул-реквестах выполняется только сборка таргетов (job `build`) —
# она ловит самое частое: таргет перестал компилироваться после правки
# API и потому молча не запускался бы ночью.
on:
  schedule:
    # 03:00 UTC ежедневно.
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/gasapp-protocol/**"
      # gasapp-backup фаззится таргетом backup_restore. Его тут не было,
      # поэтому правка разбора файла копии не поднимала фаззинг вовсе.
      - "crates/gasapp-backup/**"
      - "crates/gasapp-types/**"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Секунд на таргет"
        required: false
        default: "300"
      runs_per_target:
        description: >-
          Итераций на таргет вместо времени. Пусто — считать по времени.
          Для рубежа M8 («100M+ итераций на всех таргетах») — 100000000.
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Быстрая проверка: таргеты собираются. Идёт на пул-реквестах.
  build:
    name: targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 🔐 Токен не остаётся в .git/config: сборка запускает чужой код
          # (build.rs зависимостей, плагины Gradle), и он прочёл бы его оттуда.
          persist-credentials: false
      # libFuzzer требует nightly: санитайзеры и `-C passes=sancov-module`
      # на стабильном канале недоступны.
      #
      # На Linux этого достаточно. На Windows MSVC сборка падает на
      # линковке — x64-библиотеки ASan отсутствуют в Build Tools 2019,
      # поэтому локально прогон идёт через `fuzz/Dockerfile`
      # (см. `fuzz/README.md`). В CI контейнер не нужен.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: build all targets
        run: cargo fuzz build --fuzz-dir fuzz

      # 🔐 Таргет, объявленный в Cargo.toml и забытый в матрице ночного
      # прогона, выглядит работающим: он собирается на каждом PR.
      # Фаззится при этом ноль раз. Сверка списков — единственное, что
      # это ловит.
      - name: matrix covers every target
        run: |
          set -euo pipefail

          # sed, а не grep -P: PCRE недоступен там, где locale не UTF-8,
          # и первая же версия этой проверки молча нашла ноль таргетов
          # с обеих сторон — то есть сошлась сама с собой.
          declared=$(sed -n 's/^name = "\([a-z_]*\)"$/\1/p' fuzz/Cargo.toml \
            | grep -v '^gasapp-fuzz$' | sort -u)
          listed=$(sed -n 's/^ *- \([a-z_]*\)$/\1/p' \
            .github/workflows/fuzz.yml | sort -u)

          # Пустые списки сравниваются как равные, поэтому сверке
          # обязательно предшествует проверка на «нашлось хоть что-то».
          count=$(printf '%s' "$declared" | grep -c . || true)

          if [ "$count" -lt 2 ]; then
            echo "::error::разбор fuzz/Cargo.toml дал $count таргетов — сломан сам разбор"
            exit 1
          fi

          if [ "$declared" != "$listed" ]; then
            echo "::error::матрица ночного прогона разошлась с fuzz/Cargo.toml"
            diff <(echo "$declared") <(echo "$listed") || true
            exit 1
          fi

          echo "таргетов в прогоне: $count"

  # Ночной прогон. Каждый таргет фаззится независимо, поэтому падение
  # одного не отменяет остальные.
  run:
    name: "fuzz · ${{ matrix.target }}"
    # На пул-реквестах не запускается: только по расписанию и вручную.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ Список обязан совпадать с [[bin]] в fuzz/Cargo.toml.
        # Расхождение молчаливо: таргет, которого здесь нет, исправно
        # собирается в job `build` и не фаззится никогда. Так и было
        # с backup_restore (M6) и parse_sealed_sender (M7) — оба
        # добавлены в Cargo.toml и оба ни разу не запускались.
        # Проверку совпадения делает шаг `matrix covers every target`.
        target:
          - chunk_reassembly
          - parse_message
          - parse_content
          - decrypt_session
          - parse_prekey_bundle
          - parse_session_state
          - parse_safety_number
          - backup_restore
          - parse_sealed_sender
          - parse_contact_link
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 🔐 Токен не остаётся в .git/config: сборка запускает чужой код
          # (build.rs зависимостей, плагины Gradle), и он прочёл бы его оттуда.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Корпус кэшируется между прогонами: накопленные интересные входы
      # дают следующему прогону стартовать не с нуля. Ключ включает номер
      # запуска, restore-keys подхватывают последний доступный корпус.
      - name: restore corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_number }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # По умолчанию прогон ограничен временем: ночной запуск обязан
      # укладываться в ночь.
      #
      # Рубеж M8 задан иначе — «100M+ итераций на всех таргетах», — и
      # временем он не выражается: на медленном таргете час даёт на два
      # порядка меньше итераций, чем на быстром. Для него запускают
      # workflow вручную с `runs_per_target`, и тогда предел по времени
      # снимается совсем: иначе итоговое число итераций молча зависело бы
      # от того, что кончилось раньше.
      - name: run
        env:
          DURATION: ${{ github.event.inputs.duration_seconds || '3600' }}
          RUNS: ${{ github.event.inputs.runs_per_target || '' }}
        run: |
          if [ -n "$RUNS" ]; then
            limit="-runs=$RUNS"
          else
            limit="-max_total_time=$DURATION"
          fi

          cargo fuzz run --fuzz-dir fuzz "${{ matrix.target }}" -- \
            "$limit" \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      # Артефакт сохраняется только при падении: это вход, воспроизводящий
      # краш, и он нужен для отладки. При успехе сохранять нечего.
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
