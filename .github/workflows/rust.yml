name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия продублирована из rust-toolchain.toml намеренно: action
      # ставит тулчейн до того, как cargo прочитает файл. При обновлении
      # версии правятся оба места — расхождение поймает шаг «toolchain pin
      # matches CI» ниже.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: rustfmt
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features

      - name: tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --all-features

      - name: doc tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --doc

      # Cargo.lock обязан быть в репозитории и актуальным:
      # без этого сборка не воспроизводима.
      - name: Cargo.lock is committed and up to date
        run: cargo metadata --manifest-path crates/Cargo.toml --locked --format-version 1 > /dev/null

      # Версия тулчейна указана в двух местах — они не должны разъезжаться.
      - name: toolchain pin matches CI
        run: |
          set -euo pipefail
          pinned=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          actual=$(rustc --version | awk '{print $2}')
          if [ "$pinned" != "$actual" ]; then
            echo "::error::rust-toolchain.toml pins $pinned but CI runs $actual"
            exit 1
          fi
          echo "OK: toolchain $pinned"

  # ---------------------------------------------------------------------------
  #  Сервер: отдельный workspace, отдельная лицензия (AGPL), отдельный прогон.
  #
  #  ⚠️ До появления этого джоба серверный код в CI не собирался вовсе —
  #  проверялся только `crates/`. Интеграционные тесты при этом молча
  #  пропускались без `AEGIS_TEST_DATABASE_URL`, и семь тестов из
  #  семнадцати были красными всё время, пока считались зелёными:
  #  подпись в них делалась ed25519, а сервер проверяет XEdDSA.
  #
  #  Поэтому база здесь не «если получится», а условие запуска:
  #  `AEGIS_REQUIRE_DATABASE` превращает пропуск в падение.
  # ---------------------------------------------------------------------------
  server:
    name: server · clippy · tests (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-dev
          POSTGRES_DB: aegis
        ports:
          - 5433:5432
        # Без проверки готовности первый же тест упирается в базу,
        # которая ещё поднимается, и падает «не смог подключиться».
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis:aegis-dev@localhost:5433/aegis
      AEGIS_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: rustfmt
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: clippy
        run: >-
          cargo clippy --manifest-path server/Cargo.toml
          --workspace --all-targets --all-features

      # Схему готовит сам набор тестов (server/test-support/schema.rs):
      # миграции применяются под консультативной блокировкой, один раз
      # на базу, поэтому три исполняемых файла тестов не мешают друг другу.
      - name: tests
        run: >-
          cargo test --manifest-path server/Cargo.toml
          --workspace --all-features

      - name: Cargo.lock is committed and up to date
        run: >-
          cargo metadata --manifest-path server/Cargo.toml
          --locked --format-version 1 > /dev/null

  # ---------------------------------------------------------------------------
  #  Клиент против НАСТОЯЩЕГО сервера
  #
  #  ⚠️ Эти тесты помечены `#[ignore]` и до сих пор не запускались ни разу:
  #  сервер для них никто не поднимал. Первый же запуск нашёл два дефекта
  #  в самом наборе — транспорт терял заголовки подписи, а `now()` был
  #  зафиксирован на 2025 год, из-за чего каждый подписанный запрос
  #  оказывался просроченным (окно свежести — пять минут).
  #
  #  Набор проверяет то, чего не покажет ни заглушка, ни HTTP-тесты
  #  сервера: что клиент и сервер договариваются между собой — по форме
  #  запроса, по proof-of-work, по подписи и по адресации.
  # ---------------------------------------------------------------------------
  client-against-server:
    name: client talks to the real server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-dev
          POSTGRES_DB: aegis
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            server

      - name: build the server
        run: cargo build --manifest-path server/Cargo.toml -p aegis-server-api

      # Сервер поднимается на том же хосте: тестам нужен настоящий
      # разбор HTTP, а не обёртка вокруг роутера.
      - name: start the server
        run: |
          set -euo pipefail

          DATABASE_URL=postgres://aegis:aegis-dev@localhost:5433/aegis \
          AEGIS_BIND=127.0.0.1:8443 \
            server/target/debug/aegis-server-api > server.log 2>&1 &

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8443/health; then
              echo "сервер поднялся"
              exit 0
            fi
            sleep 1
          done

          echo "::error::сервер не поднялся за 30 секунд"
          cat server.log
          exit 1

      # ⚠️ `--ignored` обязателен: без него набор молча не выполнится,
      # и джоб будет зелёным, ничего не проверив.
      - name: client against the server
        env:
          AEGIS_SERVER: http://127.0.0.1:8443
        run: |
          set -euo pipefail

          output=$(cargo test --manifest-path crates/Cargo.toml \
            -p aegis-core --test live_server -- --ignored 2>&1 | tee /dev/stderr)

          # Проверка проверки: набор из нуля тестов «проходит» всегда.
          if echo "$output" | grep -qE "test result: ok\. 0 passed"; then
            echo "::error::не выполнено ни одного теста против живого сервера"
            exit 1
          fi

      - name: server log
        if: always()
        run: cat server.log || true

  cross-compile:
    name: cross-compile ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-ios,       os: macos-latest }
          - { target: aarch64-apple-ios-sim,   os: macos-latest }
          - { target: aarch64-linux-android,   os: ubuntu-latest }
          - { target: armv7-linux-androideabi, os: ubuntu-latest }
          - { target: x86_64-linux-android,    os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: ${{ matrix.target }}

      - name: install cargo-ndk
        if: contains(matrix.target, 'android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: build
        run: cargo build --manifest-path crates/Cargo.toml --workspace --release --target ${{ matrix.target }}
