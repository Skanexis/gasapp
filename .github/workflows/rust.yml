name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 🔐 Токен не остаётся в .git/config: сборка запускает чужой код
          # (build.rs зависимостей, плагины Gradle), и он прочёл бы его оттуда.
          persist-credentials: false
      # Версия продублирована из rust-toolchain.toml намеренно: action
      # ставит тулчейн до того, как cargo прочитает файл. При обновлении
      # версии правятся оба места — расхождение поймает шаг «toolchain pin
      # matches CI» ниже.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates

      - name: rustfmt
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features

      - name: tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --all-features

      - name: doc tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --doc

      # Документация собирается без предупреждений. Неразрешённая ссылка
      # в rustdoc — чаще всего устаревшее утверждение: так нашлось
      # обещание ошибки `GasAppError::NotFound`, которой нет (404 приходит
      # как `SessionNotFound`), и ссылки на переименованные константы.
      - name: docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path crates/Cargo.toml --workspace --no-deps

      # Cargo.lock обязан быть в репозитории и актуальным:
      # без этого сборка не воспроизводима.
      - name: Cargo.lock is committed and up to date
        run: cargo metadata --manifest-path crates/Cargo.toml --locked --format-version 1 > /dev/null

      # Версия тулчейна указана в двух местах — они не должны разъезжаться.
      - name: toolchain pin matches CI
        run: |
          set -euo pipefail
          pinned=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          actual=$(rustc --version | awk '{print $2}')
          if [ "$pinned" != "$actual" ]; then
            echo "::error::rust-toolchain.toml pins $pinned but CI runs $actual"
            exit 1
          fi
          echo "OK: toolchain $pinned"

  # ---------------------------------------------------------------------------
  #  Сервер: отдельный workspace, отдельная лицензия (AGPL), отдельный прогон.
  #
  #  ⚠️ До появления этого джоба серверный код в CI не собирался вовсе —
  #  проверялся только `crates/`. Интеграционные тесты при этом молча
  #  пропускались без `GASAPP_TEST_DATABASE_URL`, и семь тестов из
  #  семнадцати были красными всё время, пока считались зелёными:
  #  подпись в них делалась ed25519, а сервер проверяет XEdDSA.
  #
  #  Поэтому база здесь не «если получится», а условие запуска:
  #  `GASAPP_REQUIRE_DATABASE` превращает пропуск в падение.
  # ---------------------------------------------------------------------------
  server:
    name: server · clippy · tests (postgres)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gasapp
          POSTGRES_PASSWORD: gasapp-dev
          POSTGRES_DB: gasapp
        ports:
          - 5433:5432
        # Без проверки готовности первый же тест упирается в базу,
        # которая ещё поднимается, и падает «не смог подключиться».
        options: >-
          --health-cmd "pg_isready -U gasapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GASAPP_TEST_DATABASE_URL: postgres://gasapp:gasapp-dev@localhost:5433/gasapp
      GASAPP_REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 🔐 Токен не остаётся в .git/config: сборка запускает чужой код
          # (build.rs зависимостей, плагины Gradle), и он прочёл бы его оттуда.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server

      - name: rustfmt
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: clippy
        run: >-
          cargo clippy --manifest-path server/Cargo.toml
          --workspace --all-targets --all-features

      - name: docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path server/Cargo.toml --workspace --no-deps

      # Схему готовит сам набор тестов (server/test-support/schema.rs):
      # миграции применяются под консультативной блокировкой, один раз
      # на базу, поэтому три исполняемых файла тестов не мешают друг другу.
      - name: tests
        run: >-
          cargo test --manifest-path server/Cargo.toml
          --workspace --all-features

      - name: Cargo.lock is committed and up to date
        run: >-
          cargo metadata --manifest-path server/Cargo.toml
          --locked --format-version 1 > /dev/null

  # ---------------------------------------------------------------------------
  #  Клиент против НАСТОЯЩЕГО сервера
  #
  #  ⚠️ Эти тесты помечены `#[ignore]` и до сих пор не запускались ни разу:
  #  сервер для них никто не поднимал. Первый же запуск нашёл два дефекта
  #  в самом наборе — транспорт терял заголовки подписи, а `now()` был
  #  зафиксирован на 2025 год, из-за чего каждый подписанный запрос
  #  оказывался просроченным (окно свежести — пять минут).
  #
  #  Набор проверяет то, чего не покажет ни заглушка, ни HTTP-тесты
  #  сервера: что клиент и сервер договариваются между собой — по форме
  #  запроса, по proof-of-work, по подписи и по адресации.
  # ---------------------------------------------------------------------------
  client-against-server:
    name: client talks to the real server
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gasapp
          POSTGRES_PASSWORD: gasapp-dev
          POSTGRES_DB: gasapp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gasapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 🔐 Токен не остаётся в .git/config: сборка запускает чужой код
          # (build.rs зависимостей, плагины Gradle), и он прочёл бы его оттуда.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates
            server

      - name: build the server
        run: cargo build --manifest-path server/Cargo.toml -p gasapp-server-api

      # Сервер поднимается на том же хосте: тестам нужен настоящий
      # разбор HTTP, а не обёртка вокруг роутера.
      - name: start the server
        run: |
          set -euo pipefail

          # 🔐 GASAPP_ALLOW_INSECURE обязателен и здесь тоже.
          #
          # Сервер отказывается подниматься без TLS и без ключа подписи
          # сертификатов — молчаливый откат к незащищённому режиму
          # запрещён. Тестам защита не нужна, но сказать об этом
          # приходится вслух, и это верно: иначе тот же самый запуск
          # однажды оказался бы боевым.
          DATABASE_URL=postgres://gasapp:gasapp-dev@localhost:5433/gasapp \
          GASAPP_BIND=127.0.0.1:8443 \
          GASAPP_ALLOW_INSECURE=1 \
            server/target/debug/gasapp-server-api > server.log 2>&1 &

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8443/health; then
              echo "сервер поднялся"
              exit 0
            fi
            sleep 1
          done

          echo "::error::сервер не поднялся за 30 секунд"
          cat server.log
          exit 1

      # ⚠️ `--ignored` обязателен: без него набор молча не выполнится,
      # и джоб будет зелёным, ничего не проверив.
      - name: client against the server
        env:
          GASAPP_SERVER: http://127.0.0.1:8443
        run: |
          set -euo pipefail

          output=$(cargo test --manifest-path crates/Cargo.toml \
            -p gasapp-core --test live_server -- --ignored 2>&1 | tee /dev/stderr)

          # Проверка проверки: набор из нуля тестов «проходит» всегда.
          if echo "$output" | grep -qE "test result: ok\. 0 passed"; then
            echo "::error::не выполнено ни одного теста против живого сервера"
            exit 1
          fi

      - name: server log
        if: always()
        run: cat server.log || true

  cross-compile:
    name: cross-compile ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-ios,       os: macos-15 }
          - { target: aarch64-apple-ios-sim,   os: macos-15 }
          - { target: aarch64-linux-android,   os: ubuntu-24.04 }
          - { target: armv7-linux-androideabi, os: ubuntu-24.04 }
          - { target: x86_64-linux-android,    os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 🔐 Токен не остаётся в .git/config: сборка запускает чужой код
          # (build.rs зависимостей, плагины Gradle), и он прочёл бы его оттуда.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates
          key: ${{ matrix.target }}

      - name: install cargo-ndk
        if: contains(matrix.target, 'android')
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-ndk

      # vendored-openssl: в SDK iOS и NDK нет системного OpenSSL, а он
      # нужен SQLCipher — без флага ядро под телефоны не собирается
      # (так же собирают tools/build-rust-ios.sh и build-rust-android.sh).
      - name: build
        run: cargo build --manifest-path crates/Cargo.toml --workspace --release --target ${{ matrix.target }} --features gasapp-ffi/vendored-openssl
