# SPDX-License-Identifier: Apache-2.0
[package]
name = "gasapp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Крейт намеренно вне workspace `crates/`: он собирается только nightly
# с санитайзерами libFuzzer, и включение его в общий workspace ломало бы
# `cargo build --workspace` на стабильном компиляторе.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gasapp-protocol = { path = "../crates/gasapp-protocol" }
gasapp-types = { path = "../crates/gasapp-types" }
# Разбор файла резервной копии: заголовок читается до проверки тега,
# то есть на данных, подконтрольных тому, у кого файл.
gasapp-backup = { path = "../crates/gasapp-backup" }
# Очистка метаданных вложений: разбирает JPEG/PNG/WebP/GIF/MP4/MP3,
# которые пишет кто угодно.
gasapp-media = { path = "../crates/gasapp-media" }
# Версия совпадает с той, что использует `gasapp-protocol`: иначе типы
# источника случайности окажутся разными и не подойдут по трейтам.
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[[bin]]
name = "chunk_reassembly"
path = "fuzz_targets/chunk_reassembly.rs"
test = false
doc = false

[[bin]]
name = "parse_message"
path = "fuzz_targets/parse_message.rs"
test = false
doc = false

[[bin]]
name = "parse_content"
path = "fuzz_targets/parse_content.rs"
test = false
doc = false

[[bin]]
name = "decrypt_session"
path = "fuzz_targets/decrypt_session.rs"
test = false
doc = false

[[bin]]
name = "parse_prekey_bundle"
path = "fuzz_targets/parse_prekey_bundle.rs"
test = false
doc = false

[[bin]]
name = "parse_session_state"
path = "fuzz_targets/parse_session_state.rs"
test = false
doc = false

[[bin]]
name = "parse_safety_number"
path = "fuzz_targets/parse_safety_number.rs"
test = false
doc = false

[[bin]]
name = "backup_restore"
path = "fuzz_targets/backup_restore.rs"
test = false
doc = false

[[bin]]
name = "parse_sealed_sender"
path = "fuzz_targets/parse_sealed_sender.rs"
test = false
doc = false

[[bin]]
name = "parse_contact_link"
path = "fuzz_targets/parse_contact_link.rs"
test = false
doc = false

[[bin]]
name = "scrub_attachment"
path = "fuzz_targets/scrub_attachment.rs"
test = false
doc = false
