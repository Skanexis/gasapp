# SPDX-License-Identifier: Apache-2.0
#
# Проверка iOS-приложения на Mac в Codemagic — та же, что `ios.yml` в
# GitHub Actions: ядро Rust под iOS, проверка типов Swift, проект Xcode,
# сборка для симулятора и снимок каждого экрана (tools/mac-check.sh).
#
# Запуск — вручную: codemagic.io → приложение gasapp → «Start new build»
# → workflow «iOS check». Отчёт — в артефактах сборки: mac-report.zip
# (SUMMARY.txt, ошибки Swift и сборки, screens/*.png).
#
# ios-check — секретов не нужно: сборка для симулятора не подписывается
# и сервер не трогает.
#
# ios-testflight — релиз: подпись и выгрузка в TestFlight. Нужна группа
# переменных «app_store» (Codemagic → gasapp → App settings → Environment variables, см.
# ВЫПУСК-ПРИЛОЖЕНИЯ.md, часть «iOS»):
#   APPLE_TEAM_ID  — Team ID (10 символов)
#   ASC_KEY_ID     — ключ App Store Connect API: Key ID
#   ASC_ISSUER_ID  — Issuer ID
#   ASC_KEY_P8     — содержимое AuthKey_….p8 целиком (Secure)
#   CERTIFICATE_PRIVATE_KEY — V:\gasapp\apple\ios-distribution-key.pem целиком
# Адрес сервера, onion и пины — из tools/release.conf (не секрет).

workflows:
  ios-check:
    name: iOS check (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.rustup/toolchains
    scripts:
      - name: Rust (версия — из rust-toolchain.toml)
        script: |
          set -euo pipefail
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          source "$HOME/.cargo/env"
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version
      - name: Проверка на Mac (ядро, Swift, Xcode, симулятор, снимки)
        script: |
          source "$HOME/.cargo/env"
          bash tools/mac-check.sh < /dev/null
      - name: Итог
        script: |
          cat mac-report/SUMMARY.txt
          ! grep -E "ОШИБКА|УПАЛО|ПРОПУЩЕНО" mac-report/SUMMARY.txt
    artifacts:
      - mac-report.zip

  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      groups:
        - app_store
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.rustup/toolchains
    scripts:
      - name: Секреты Apple на месте
        script: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 CERTIFICATE_PRIVATE_KEY; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Нет переменных:$missing — Codemagic → gasapp → App settings → Environment variables → группа app_store (ВЫПУСК-ПРИЛОЖЕНИЯ.md)"
            exit 1
          fi
      - name: Настройки выпуска совпадают с tools/release.conf
        script: python3 tools/apply-release-config.py --check
      - name: Rust (версия — из rust-toolchain.toml)
        script: |
          set -euo pipefail
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          source "$HOME/.cargo/env"
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: Ядро Rust для iOS (релиз)
        script: |
          source "$HOME/.cargo/env"
          bash tools/build-rust-ios.sh
      - name: Проект Xcode
        script: |
          set -euo pipefail
          command -v xcodegen > /dev/null 2>&1 || brew install xcodegen
          echo "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}" > ios/Config/Local.xcconfig
          cd ios && xcodegen generate
      - name: Подпись (сертификат и профиль App Store)
        script: |
          set -euo pipefail
          # Инструменты Codemagic говорят с App Store Connect напрямую
          # ключом API: сами создают сертификат «Apple Distribution» (из
          # CERTIFICATE_PRIVATE_KEY — один и тот же каждый раз, поэтому
          # новых сертификатов не плодится) и профиль App Store.
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="$ASC_KEY_P8"
          keychain initialize
          app-store-connect fetch-signing-files org.gasapp.messenger \
            --type IOS_APP_STORE --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          xcode-project use-profiles --project ios/GasApp.xcodeproj
      - name: Сборка и выгрузка в TestFlight
        script: |
          set -euo pipefail
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="$ASC_KEY_P8"
          # Номер сборки — дата и время (ГГММДДЧЧММ, UTC): растёт сам, и
          # App Store Connect не отвергнет его как повтор.
          BUILD=$(date -u +%y%m%d%H%M)
          echo "Номер сборки: $BUILD"
          xcode-project build-ipa --project ios/GasApp.xcodeproj --scheme GasApp \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD"
          app-store-connect publish --path build/ios/ipa/*.ipa
          echo "✅ Выгружено. Через 10–30 минут сборка $BUILD появится в App Store Connect → TestFlight."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
