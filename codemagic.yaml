# SPDX-License-Identifier: Apache-2.0
#
# Проверка iOS-приложения на Mac в Codemagic — та же, что `ios.yml` в
# GitHub Actions: ядро Rust под iOS, проверка типов Swift, проект Xcode,
# сборка для симулятора и снимок каждого экрана (tools/mac-check.sh).
#
# Запуск — вручную: codemagic.io → приложение gasapp → «Start new build»
# → workflow «iOS check». Отчёт — в артефактах сборки: mac-report.zip
# (SUMMARY.txt, ошибки Swift и сборки, screens/*.png).
#
# ios-check — секретов не нужно: сборка для симулятора не подписывается
# и сервер не трогает.
#
# ios-testflight — релиз: подпись и выгрузка в TestFlight. Нужна группа
# переменных «app_store» (Codemagic → Teams → Global variables, см.
# ВЫПУСК-ПРИЛОЖЕНИЯ.md, часть «iOS»):
#   APPLE_TEAM_ID  — Team ID (10 символов)
#   ASC_KEY_ID     — ключ App Store Connect API: Key ID
#   ASC_ISSUER_ID  — Issuer ID
#   ASC_KEY_P8     — содержимое AuthKey_….p8 целиком (Secure)
# Адрес сервера, onion и пины — из tools/release.conf (не секрет).

workflows:
  ios-check:
    name: iOS check (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.rustup/toolchains
    scripts:
      - name: Rust (версия — из rust-toolchain.toml)
        script: |
          set -euo pipefail
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          source "$HOME/.cargo/env"
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version
      - name: Проверка на Mac (ядро, Swift, Xcode, симулятор, снимки)
        script: |
          source "$HOME/.cargo/env"
          bash tools/mac-check.sh < /dev/null
      - name: Итог
        script: |
          cat mac-report/SUMMARY.txt
          ! grep -E "ОШИБКА|УПАЛО|ПРОПУЩЕНО" mac-report/SUMMARY.txt
    artifacts:
      - mac-report.zip

  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      groups:
        - app_store
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.rustup/toolchains
    scripts:
      - name: Секреты Apple на месте
        script: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Нет переменных:$missing — Codemagic → Teams → Global variables → группа app_store (ВЫПУСК-ПРИЛОЖЕНИЯ.md)"
            exit 1
          fi
      - name: Настройки выпуска совпадают с tools/release.conf
        script: python3 tools/apply-release-config.py --check
      - name: Rust (версия — из rust-toolchain.toml)
        script: |
          set -euo pipefail
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          source "$HOME/.cargo/env"
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: Ядро Rust для iOS (релиз)
        script: |
          source "$HOME/.cargo/env"
          bash tools/build-rust-ios.sh
      - name: Проект Xcode
        script: |
          set -euo pipefail
          command -v xcodegen > /dev/null 2>&1 || brew install xcodegen
          echo "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}" > ios/Config/Local.xcconfig
          cd ios && xcodegen generate
      - name: Сборка, подпись и выгрузка в TestFlight
        script: |
          set -euo pipefail
          KEY="$CM_BUILD_DIR/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          # Подпись — автоматическая через ключ API: сертификат и профиль
          # Xcode создаёт и обновляет сам (ключу нужна роль Admin).
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Номер сборки — дата и время (ГГММДДЧЧММ, UTC): растёт сам, и
          # App Store Connect не отвергнет его как повтор.
          BUILD=$(date -u +%y%m%d%H%M)
          echo "Номер сборки: $BUILD"
          xcodebuild archive -project ios/GasApp.xcodeproj -scheme GasApp             -configuration Release -destination 'generic/platform=iOS'             -archivePath "$CM_BUILD_DIR/GasApp.xcarchive"             CURRENT_PROJECT_VERSION="$BUILD" "${AUTH[@]}" | tail -40
          test -d "$CM_BUILD_DIR/GasApp.xcarchive" || { echo "архив не собрался"; exit 1; }
          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$CM_BUILD_DIR/GasApp.xcarchive"             -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"             -exportPath "$CM_BUILD_DIR/export" "${AUTH[@]}" | tail -40
          echo "✅ Выгружено. Через 10–30 минут сборка $BUILD появится в App Store Connect → TestFlight."
